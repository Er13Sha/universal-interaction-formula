<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>W = Q·N в 3D — атомы, нуклоны и электроны</title>
  <link rel="icon" href="data:," />
  <style>
    html, body { height: 100%; }
    body { margin: 0; background: #000; overflow: hidden; }
    canvas { display: block; width: 100vw; height: 100vh; }
    #ui {
      position: absolute; top: 12px; left: 12px;
      color: #fff; font-family: "Courier New", monospace;
      text-shadow: 2px 2px 4px #000; line-height: 1.42; white-space: pre;
      user-select: none; pointer-events: none; font-size: 12px;
    }
    #hint {
      position: absolute; top: 12px; right: 12px;
      color: #7f93a8; font-family: "Courier New", monospace;
      font-size: 12px; line-height: 1.45; text-align: right; white-space: pre;
      pointer-events: none; text-shadow: 1px 1px 3px #000;
    }
    #warn {
      position: absolute; right: 12px; bottom: 14px;
      color: #8fa2b5; font-family: "Courier New", monospace;
      opacity: .8; max-width: 440px; line-height: 1.3; font-size: 10px;
      white-space: pre-wrap; pointer-events: none; text-align: right;
    }
  </style>
</head>
<body>
  <div id="ui"></div>
  <div id="hint"></div>
  <div id="warn"></div>
  <canvas id="c"></canvas>

<script type="module">
// Чистая W = Q·N: только поле тел, без кулона, кора kField, БГП и затенения.
// На старте один атом (p⁺ + n⁰ + e⁻, дейтерий); кулона нет.
// Камера: drag — вращение, колесо — масштаб.

const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
const ui = document.getElementById('ui');
const hint = document.getElementById('hint');
const warn = document.getElementById('warn');

const P = {
  G: 2.4e-43,
  r0: 1.0,
  rn: 0.45,
  focal: 620,
  camR: 6.2,
  tx: 0, ty: 0, tz: 0, camSpeed: 4,
  ox: 0, oy: 0, oz: 0,
  yaw: 0.5,
  pitch: 0.28,
  paused: false,
  timeScale: 1.0,
  showField: false,
};

const M_P = 1836, M_E = 1, M_N = 1839;

// Формула: W = Q·N, Q = k_a·C1/(4πR²), N = V·q = h·S·q, F = f(α)·n_f·W, n_f = k_v·h·S·q.
// Для тяготения k_a = k_v = f(α) = 1, C1 = 4πG ⇒ F = G·m1·m2/R².
const K_A = 1, K_V = 1, F_ALPHA = 1;
P.C1 = 4 * Math.PI * P.G;
const Q = (r) => K_A * P.C1 / (4 * Math.PI * r * r);
const kQ = () => K_A * P.C1 / (4 * Math.PI); // Q·r²

// Частица — сфера радиуса rad: S = πr², h = V/S = 4r/3, V = hS, N = Vq.
const RAD_E = 0.01;
const RAD_P = RAD_E * Math.cbrt(M_P / M_E);
const RAD_N = RAD_P * Math.cbrt(M_N / M_P);
const sphereV = (r) => (4 / 3) * Math.PI * r * r * r;
P.radE = RAD_E;
P.radP = RAD_P;
P.radN = RAD_N;
P.qE = M_E / sphereV(RAD_E); // плотности калиброваны: N(e⁻) = 1, N(p⁺) = 1836
P.qP = M_P / sphereV(RAD_P);
P.qN = P.qP;
P.mP = sphereV(P.radP) * P.qP;
P.mE = sphereV(P.radE) * P.qE;
P.mN = sphereV(P.radN) * P.qN;
function bodyProps(rad, q) {
  const S = Math.PI * rad * rad;
  const h = 4 * rad / 3;
  const V = h * S;
  const N = V * q;
  return { rad, q, S, h, V, N };
}
const SPECIES = {
  p: { rad: RAD_P, q: P.qP, color: '255,150,80', core: '#fff3e0', glow: 2, alpha: 0.45, label: 'p⁺' },
  n: { rad: RAD_N, q: P.qN, color: '200,205,215', core: '#f2f4f8', glow: 2, alpha: 0.5, label: 'n⁰' },
  e: { rad: RAD_E, q: P.qE, color: '80,230,255', core: '#eaffff', glow: 3, alpha: 0.9, label: 'e⁻' },
};
function makeBody(kind, atom, pos, vel = [0, 0, 0]) {
  const sp = SPECIES[kind];
  const props = bodyProps(sp.rad, sp.q);
  // инерция = n_f = k_v·h·S·q (для тяготения заряд — масса)
  return { kind, atom, ...props, m: K_V * props.N, p: [...pos], v: [...vel], trail: [] };
}

// Q_j·N_j в точке на расстоянии r. Внутри шара радиуса R действует только
// заряд, попавший внутрь: N(r) = V(r)·q = N·(r/R)³ — та же N = Vq, без обрезки r.
function QN(r, R, Nj) {
  if (r <= 0) return 0;
  return Q(r) * (r >= R ? Nj : Nj * (r / R) ** 3);
}
// Потенциал пары (на kQ·N_i·N_j), согласованный с QN: −dφ/dr = QN/(kQ·N_j).
function phi(r, R) {
  return r >= R ? 1 / r : (3 * R * R - r * r) / (2 * R * R * R);
}

// Круговая орбита из той же формулы: относительное ускорение
// a = Q(r)·(N_b·N_g/m_b + N_g·N_b/m_g) = v²/r. Импульс делится между телом и
// группой, так что суммарный импульс не меняется.
function orbit(body, group, r) {
  let Ng = 0, mg = 0;
  const c = [0, 0, 0], cv = [0, 0, 0];
  for (const g of group) {
    Ng += g.N; mg += g.m;
    for (let k = 0; k < 3; k++) { c[k] += g.m * g.p[k]; cv[k] += g.m * g.v[k]; }
  }
  for (let k = 0; k < 3; k++) { c[k] /= mg; cv[k] /= mg; }
  const n = norm(randDir());
  const u = norm(cross(n, randDir()));
  const t = norm(cross(n, u));
  const aRel = Q(r) * (body.N * Ng / body.m + Ng * body.N / mg);
  const vRel = Math.sqrt(aRel * r);
  const mt = mg + body.m;
  for (let k = 0; k < 3; k++) {
    body.p[k] = c[k] + u[k] * r;
    body.v[k] = cv[k] + t[k] * vRel * mg / mt;
  }
  for (const g of group) {
    for (let k = 0; k < 3; k++) g.v[k] -= t[k] * vRel * body.m / mt;
  }
  return body;
}

function randDir() {
  const u = Math.random(), v = Math.random();
  const th = 2 * Math.PI * u, ph = Math.acos(2 * v - 1);
  const s = Math.sin(ph);
  return [Math.cos(th) * s, Math.sin(th) * s, Math.cos(ph)];
}
function cross(a, b) {
  return [a[1] * b[2] - a[2] * b[1], a[2] * b[0] - a[0] * b[2], a[0] * b[1] - a[1] * b[0]];
}
function norm(a) {
  const l = Math.hypot(a[0], a[1], a[2]) || 1;
  return [a[0] / l, a[1] / l, a[2] / l];
}

// Атом дейтерия: p⁺ в покое, n⁰ на орбите rn вокруг p⁺, e⁻ на орбите r0 вокруг p⁺+n⁰.
function makeAtom(atom, base) {
  const p = makeBody('p', atom, base);
  const n = orbit(makeBody('n', atom, base), [p], P.rn);
  const e = orbit(makeBody('e', atom, base), [p, n], P.r0);
  return [p, n, e];
}
function makeParts() {
  return makeAtom(0, [0, 0, 0]);
}
let parts = makeParts();
let time = 0;
let nextAtom = 1;

function addAtom() {
  const d = randDir();
  const r = 2.3 + Math.random() * 1.2;
  parts.push(...makeAtom(nextAtom++, [d[0] * r, d[1] * r * 0.4, d[2] * r]));
}
function addNeutron() {
  const protons = parts.filter((q) => q.kind === 'p');
  if (!protons.length) return;
  const withN = new Set(parts.filter((q) => q.kind === 'n').map((q) => q.atom));
  const host = protons.find((q) => !withN.has(q.atom)) || protons[protons.length - 1];
  const nucleus = parts.filter((q) => q.kind !== 'e' && q.atom === host.atom);
  const index = nucleus.length - 1;
  parts.push(orbit(makeBody('n', host.atom, host.p), nucleus, P.rn * (1 + 0.35 * index)));
}
function removeAtom() {
  const protons = parts.filter((q) => q.kind === 'p');
  if (protons.length <= 1) return;
  const atom = protons[protons.length - 1].atom;
  for (let i = parts.length - 1; i >= 0; i--) {
    if (parts[i].atom === atom) parts.splice(i, 1);
  }
}
function removeNeutron() {
  for (let i = parts.length - 1; i >= 0; i--) {
    if (parts[i].kind === 'n') { parts.splice(i, 1); return; }
  }
}
function addElectron() {
  const d = randDir();
  const r = 0.8 + Math.random() * 1.4;
  parts.push(makeBody('e', -1, [d[0] * r, d[1] * r * 0.4, d[2] * r]));
}
function removeElectron() {
  for (let i = parts.length - 1; i >= 0; i--) {
    if (parts[i].kind === 'e' && parts[i].atom === -1) { parts.splice(i, 1); return; }
  }
}
function makeG() {
  const el = document.createElement('div');
  el.style.cssText = 'position:absolute;right:12px;bottom:80px;color:#9fb0c2;font-family:"Courier New",monospace;font-size:11px;background:rgba(8,14,24,.55);border:1px solid rgba(120,170,220,.2);border-radius:8px;padding:8px 10px;';
  el.innerHTML = '<div>log10 G <input id="gSl" type="range" min="-45" max="6" step="0.1" value="-42.6" style="width:140px"></div><div id="gVal"></div>';
  document.body.appendChild(el);
  const sl = el.querySelector('#gSl'), val = el.querySelector('#gVal');
  const upd = () => {
    const lv = sl && sl.value !== undefined && sl.value !== '' ? Number(sl.value) : NaN;
    if (!Number.isFinite(lv)) return;
    P.G = Math.pow(10, lv);
    P.C1 = 4 * Math.PI * P.G;
    val.textContent = 'G=' + P.G.toExponential(2) + '  C1=4πG=' + P.C1.toExponential(2);
  };
  sl.addEventListener('input', upd);
  upd();
}
function makeBar() {
  const bar = document.createElement('div');
  bar.style.cssText = 'position:absolute;left:50%;bottom:14px;transform:translateX(-50%);display:flex;gap:8px;font-family:"Courier New",monospace;';
  bar.innerHTML = '<button id="addA">+ атом</button><button id="delA">− атом</button><button id="addN">+ n⁰</button><button id="delN">− n⁰</button><button id="addE">+ e⁻</button><button id="delE">− e⁻</button><button id="demo">демо G</button>';
  for (const b of bar.querySelectorAll('button')) {
    b.style.cssText = 'background:rgba(18,28,44,.8);color:#9fb7d4;border:1px solid rgba(120,170,220,.35);padding:6px 12px;font:inherit;font-size:13px;border-radius:6px;cursor:pointer;';
  }
  document.body.appendChild(bar);
  bar.querySelector('#addA').onclick = addAtom;
  bar.querySelector('#delA').onclick = removeAtom;
  bar.querySelector('#addN').onclick = addNeutron;
  bar.querySelector('#delN').onclick = removeNeutron;
  bar.querySelector('#addE').onclick = addElectron;
  bar.querySelector('#delE').onclick = removeElectron;
  bar.querySelector('#demo').onclick = () => {
    const sl = document.getElementById('gSl');
    if (!sl) return;
    sl.value = '-5';
    sl.dispatchEvent(new Event('input'));
  };
}
// W_i = Σ_j Q_j·N_j (вектор к источнику), F_i = f(α)·n_f·W_i, n_f = k_v·N_i, a_i = F_i/m_i.
function accelerate() {
  const a = parts.map(() => [0, 0, 0]);
  for (let i = 0; i < parts.length; i++) {
    const A = parts[i];
    let Wx = 0, Wy = 0, Wz = 0;
    for (let j = 0; j < parts.length; j++) {
      if (j === i) continue;
      const B = parts[j];
      const rx = B.p[0] - A.p[0], ry = B.p[1] - A.p[1], rz = B.p[2] - A.p[2];
      const r = Math.hypot(rx, ry, rz);
      if (r === 0) continue;
      const w = QN(r, Math.max(A.rad, B.rad), B.N);
      Wx += w * rx / r; Wy += w * ry / r; Wz += w * rz / r;
    }
    const F = F_ALPHA * K_V * A.N;
    a[i][0] = F * Wx / A.m;
    a[i][1] = F * Wy / A.m;
    a[i][2] = F * Wz / A.m;
  }
  return a;
}


// Динамическое время самой тесной пары из той же формулы: t = √(r³ / (kQ·(N_i+N_j))).
function dynTime() {
  let t = Infinity;
  for (let i = 0; i < parts.length; i++) {
    for (let j = i + 1; j < parts.length; j++) {
      const A = parts[i], B = parts[j];
      const r = Math.max(Math.max(A.rad, B.rad),
        Math.hypot(B.p[0] - A.p[0], B.p[1] - A.p[1], B.p[2] - A.p[2]));
      t = Math.min(t, Math.sqrt(r * r * r / (kQ() * (A.N + B.N))));
    }
  }
  return t;
}

function step(dt) {
  const a0 = accelerate();
  for (let i = 0; i < parts.length; i++) {
    const p = parts[i];
    p.v[0] += 0.5 * a0[i][0] * dt; p.v[1] += 0.5 * a0[i][1] * dt; p.v[2] += 0.5 * a0[i][2] * dt;
    p.p[0] += p.v[0] * dt; p.p[1] += p.v[1] * dt; p.p[2] += p.v[2] * dt;
  }
  const a1 = accelerate();
  for (let i = 0; i < parts.length; i++) {
    const p = parts[i];
    p.v[0] += 0.5 * a1[i][0] * dt; p.v[1] += 0.5 * a1[i][1] * dt; p.v[2] += 0.5 * a1[i][2] * dt;
    if (p.kind === 'e') {
      p.trail.push([p.p[0], p.p[1], p.p[2]]);
      if (p.trail.length > 375) p.trail.shift();
    }
  }
  time += dt;
}
// ---------- 3D → экран ----------
let W = 0, H = 0, dpr = 1;
function resize() {
  dpr = Math.max(1, Math.min(2, devicePixelRatio || 1));
  canvas.width = Math.floor(innerWidth * dpr);
  canvas.height = Math.floor(innerHeight * dpr);
  W = innerWidth; H = innerHeight;
}
addEventListener('resize', resize);
resize();

function project(p) {
  const cy = Math.cos(P.yaw), sy = Math.sin(P.yaw);
  const cp = Math.cos(P.pitch), sp = Math.sin(P.pitch);
  const px = p[0] - P.tx, py = p[1] - P.ty, pz = p[2] - P.tz;
  const x1 = px * cy - pz * sy;
  const z1 = px * sy + pz * cy;
  const y1 = py;
  const y2 = y1 * cp - z1 * sp;
  const z2 = y1 * sp + z1 * cp;
  const zc = z2 + P.camR;
  if (zc < 0.2) return null;
  const s = P.focal / zc;
  return [W / 2 + x1 * s, H / 2 - y2 * s, zc, s];
}

function glow(x, y, r, rgb, a) {
  const g = ctx.createRadialGradient(x, y, 0, x, y, r);
  g.addColorStop(0, `rgba(${rgb},${a})`);
  g.addColorStop(0.45, `rgba(${rgb},${a * 0.5})`);
  g.addColorStop(1, `rgba(${rgb},0)`);
  ctx.fillStyle = g;
  ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI * 2); ctx.fill();
}

// Свечение = Q_j·N_j тела, отнесённое к полю протона на r0: та же QN, что и в динамике.
function drawField() {
  ctx.globalCompositeOperation = 'lighter';
  const W0 = QN(P.r0, 0, P.mP);
  const cut = 0.02;
  for (let idx = 0; idx < parts.length; idx++) {
    const pt = parts[idx];
    const s = project(pt.p);
    if (!s) continue;
    const worldR = P.r0 * Math.sqrt(pt.N / P.mP / cut);
    const screenR = worldR * s[3];
    if (!(screenR > 4)) continue;
    const g = ctx.createRadialGradient(s[0], s[1], 0, s[0], s[1], screenR);
    const rgb = pt.atom === 0 ? '90,170,255' : '255,160,90';
    for (let k = 0; k <= 20; k++) {
      const kk = k / 20;
      const a = Math.min(0.35, 0.35 * QN(kk * worldR, pt.rad, pt.N) / W0);
      g.addColorStop(kk, 'rgba(' + rgb + ',' + a.toFixed(4) + ')');
    }
    ctx.fillStyle = g;
    ctx.beginPath();
    ctx.arc(s[0], s[1], screenR, 0, Math.PI * 2);
    ctx.fill();
  }
  ctx.globalCompositeOperation = 'source-over';
}
function draw() {
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  ctx.clearRect(0, 0, W, H);
  ctx.fillStyle = '#000';
  ctx.fillRect(0, 0, W, H);
  if (P.showField) drawField();

  // следы электронов
  for (const e of parts) {
    if (e.kind !== 'e') continue;
    for (let i = 1; i < e.trail.length; i++) {
      const A = project(e.trail[i - 1]), B = project(e.trail[i]);
      if (!A || !B) continue;
      const t = i / e.trail.length;
      ctx.strokeStyle = `rgba(80,220,255,${0.10 * t})`;
      ctx.lineWidth = 1.5;
      ctx.beginPath(); ctx.moveTo(A[0], A[1]); ctx.lineTo(B[0], B[1]); ctx.stroke();
    }
  }

  // линия между протонами
  const pps = parts.filter((p) => p.kind === 'p');
  const s0 = pps[0] ? project(pps[0].p) : null;
  const s1 = pps[1] ? project(pps[1].p) : null;
  if (s0 && s1) {
    ctx.strokeStyle = 'rgba(160,190,220,.25)';
    ctx.setLineDash([4, 5]);
    ctx.beginPath(); ctx.moveTo(s0[0], s0[1]); ctx.lineTo(s1[0], s1[1]); ctx.stroke();
    ctx.setLineDash([]);
  }

  // частицы: экранный радиус = rad * s — в масштабе объёма
  for (const kind of ['p', 'n', 'e']) {
    const sp = SPECIES[kind];
    for (const pt of parts) {
      if (pt.kind !== kind) continue;
      const s = project(pt.p);
      if (!s) continue;
      const rr = Math.max(0.7, pt.rad * s[3]);
      glow(s[0], s[1], Math.max(rr * sp.glow, 1.5), sp.color, sp.alpha);
      ctx.fillStyle = sp.core;
      ctx.beginPath(); ctx.arc(s[0], s[1], rr, 0, Math.PI * 2); ctx.fill();
    }
  }

  // подписи
  ctx.font = '12px "Courier New"';
  ctx.fillStyle = '#9fb0c2';
  for (const pt of parts) {
    const s = project(pt.p);
    if (!s) continue;
    const dy = Math.max(12, pt.rad * s[3] + 10);
    ctx.fillText(SPECIES[pt.kind].label, s[0] - 6, s[1] - dy);
  }

  return { s0, s1 };
}

// камера
let dragging = false, lx = 0, ly = 0;
canvas.addEventListener('pointerdown', (e) => { dragging = true; lx = e.clientX; ly = e.clientY; });
canvas.addEventListener('pointerup', () => { dragging = false; });
canvas.addEventListener('pointercancel', () => { dragging = false; });
canvas.addEventListener('pointermove', (e) => {
  if (!dragging) return;
  P.yaw += (e.clientX - lx) * 0.006;
  P.pitch = Math.max(-1.4, Math.min(1.4, P.pitch + (e.clientY - ly) * 0.006));
  lx = e.clientX; ly = e.clientY;
});
canvas.addEventListener('wheel', (e) => {
  P.camR = Math.max(2.5, Math.min(20, P.camR * (1 + e.deltaY * 0.001)));
  e.preventDefault();
}, { passive: false });

// цикл
let last = performance.now();
let simAcc = 0;
let FIXED = 1 / 120;
let fps = 0, fpsN = 0, fpsT = performance.now();

// E = KE + U, U = −kQ·N_i·N_j·φ(r): потенциал той же силы, что в accelerate().
function totalEnergy() {
  let E = 0;
  const px = [0, 0, 0];
  for (const p of parts) {
    E += 0.5 * p.m * (p.v[0] * p.v[0] + p.v[1] * p.v[1] + p.v[2] * p.v[2]);
    for (let k = 0; k < 3; k++) px[k] += p.m * p.v[k];
  }
  for (let i = 0; i < parts.length; i++) {
    for (let j = i + 1; j < parts.length; j++) {
      const A = parts[i], B = parts[j];
      const r = Math.hypot(B.p[0] - A.p[0], B.p[1] - A.p[1], B.p[2] - A.p[2]);
      E -= F_ALPHA * K_V * kQ() * A.N * B.N * phi(r, Math.max(A.rad, B.rad));
    }
  }
  return { E, Pm: Math.hypot(px[0], px[1], px[2]) };
}

function frame() {
  const now = performance.now();
  const realDt = Math.min((now - last) / 1000, 0.05);
  last = now;

  if (!P.paused) {
    FIXED = Math.min(1 / 120, 0.02 * dynTime());
    simAcc += realDt * P.timeScale;
    let n = 0;
    while (simAcc >= FIXED && n < 400) { step(FIXED); simAcc -= FIXED; n++; }
    if (n === 400) simAcc = 0;
  }

  const cy2 = Math.cos(P.yaw), sy2 = Math.sin(P.yaw);
  const fwd = (keys['w'] ? 1 : 0) - (keys['s'] ? 1 : 0);
  const rgt = (keys['d'] ? 1 : 0) - (keys['a'] ? 1 : 0);
  const up2 = (keys['e'] ? 1 : 0) - (keys['q'] ? 1 : 0);
  if (fwd || rgt || up2) {
    const sp2 = P.camSpeed * realDt;
    P.ox += (fwd * -cy2 + rgt * -sy2) * sp2;
    P.oz += (fwd * -sy2 + rgt * -cy2) * sp2;
    P.oy += up2 * sp2;
  }

  let mx = 0, my = 0, mz = 0, mm = 0;
  for (const p of parts) {
    mx += p.m * p.p[0]; my += p.m * p.p[1]; mz += p.m * p.p[2]; mm += p.m;
  }
  const kf = 1 - Math.exp(-realDt * 3);
  P.tx += (mx / mm + P.ox - P.tx) * kf;
  P.ty += (my / mm + P.oy - P.ty) * kf;
  P.tz += (mz / mm + P.oz - P.tz) * kf;

  const info = draw();

  fpsN++;
  if (now - fpsT > 500) { fps = fpsN / ((now - fpsT) / 1000); fpsN = 0; fpsT = now; }

  const protons = parts.filter((q) => q.kind === 'p');
  const neutrons = parts.filter((q) => q.kind === 'n');
  const electrons = parts.filter((q) => q.kind === 'e');
  const p0 = protons[0], n0 = neutrons[0], e0 = electrons[0];
  let R = 0;
  for (let i = 0; i < protons.length; i++) {
    for (let j = i + 1; j < protons.length; j++) {
      const d = Math.hypot(protons[j].p[0] - protons[i].p[0], protons[j].p[1] - protons[i].p[1], protons[j].p[2] - protons[i].p[2]);
      if (!R || d < R) R = d;
    }
  }
  const Rn = (p0 && n0)
    ? Math.hypot(n0.p[0] - p0.p[0], n0.p[1] - p0.p[1], n0.p[2] - p0.p[2])
    : 0;
  const vn = (p0 && n0)
    ? Math.hypot(n0.v[0] - p0.v[0], n0.v[1] - p0.v[1], n0.v[2] - p0.v[2])
    : 0;
  const nLine = n0
    ? `n⁰: q=${P.qN.toExponential(2)} · V=${n0.V.toExponential(2)} → N=${n0.N.toFixed(1)} (m=${n0.m.toFixed(1)})`
    : 'n⁰: —';
  const rnLine = n0 ? `\nR(p–n) = ${Rn.toFixed(2)} a₀ · v=${vn.toExponential(2)}` : '';
  const en = totalEnergy();
  ui.textContent =
`W = Q·N · 3D
воздействие = качество × количество

Q = k_a·C1/(4πR²) — качество; N = V·q = h·S·q — количество (заряд)
W = Σ Q_j·N_j; F = f(α)·n_f·W, n_f = k_v·N; a = F/m
тел: ${parts.length} · p⁺ ${protons.length} · n⁰ ${neutrons.length} · e⁻ ${electrons.length}
A = ${protons.length + neutrons.length} · Z = ${protons.length} (всего)
p⁺: q=${P.qP.toExponential(2)} · V=${p0 ? p0.V.toExponential(2) : '—'} → N=${p0 ? p0.N.toFixed(1) : '—'} (m=${p0 ? p0.m.toFixed(1) : '—'})
${nLine}
e⁻: q=${P.qE.toExponential(2)} · V=${e0 ? e0.V.toExponential(2) : '—'} → N=${e0 ? e0.N.toFixed(1) : '—'} (m=${e0 ? e0.m.toFixed(1) : '—'})
R(p–p, min) = ${R ? R.toFixed(2) : '—'} a₀${rnLine}
E = ${en.E.toExponential(6)} (KE + U) · |p| = ${en.Pm.toExponential(1)}
G = ${P.G.toExponential(2)} · C1 = 4πG = ${P.C1.toExponential(2)}
k_a = k_v = f(α) = 1 — без кулона, кора, БГП и тени
сложность: O(N²)
t = ${time.toFixed(1)} · FPS = ${fps.toFixed(0)}`;

requestAnimationFrame(frame);
}

hint.textContent =
`drag — вращение
колесо — масштаб
WASD — смещение
Q/E — вверх/вниз
камера следит за COM
Space — пауза
R — сброс
G — поле
кнопка + n⁰ — нейтрон на орбите
кнопка — демо G`;

warn.textContent =
`3D. Только W = Q·N: гравитация тел, без кулона, кора, БГП и тени.
Начальные скорости — круговые орбиты из той же формулы (a = Q·N = v²/r).
Нейтрон держится только гравитацией — на орбите rn=0.45; сильного взаимодействия нет.
При честном G орбита невидима, при «демо G» + R — видна.
масштаб m_p=1836, m_n=1839, m_e=1. Форма и числа — модельные, не СИ.`;

const keys = {};
addEventListener('keydown', (e) => {
  keys[e.key.toLowerCase()] = true;
  if (e.code === 'Space') { P.paused = !P.paused; e.preventDefault(); }
  if (e.key.toLowerCase() === 'r') { parts = makeParts(); time = 0; }
  if (e.key.toLowerCase() === 'g') P.showField = !P.showField;
});
addEventListener('keyup', (e) => { keys[e.key.toLowerCase()] = false; });

requestAnimationFrame(frame);

makeBar();
makeG();
window.__h2d = {
  P, Q, QN, makeBody, accelerate, step, totalEnergy, dynTime,
  get parts() { return parts; },
  set parts(v) { parts = v; },
  reset() { parts = makeParts(); time = 0; },
  get R() {
    const ps = parts.filter((q) => q.kind === 'p');
    return ps.length > 1 ? Math.hypot(ps[1].p[0] - ps[0].p[0], ps[1].p[1] - ps[0].p[1], ps[1].p[2] - ps[0].p[2]) : 0;
  },
  get A() { return parts.filter((q) => q.kind !== 'e').length; },
  get Z() { return parts.filter((q) => q.kind === 'p').length; },
  get time() { return time; },
};
</script>
</body>
