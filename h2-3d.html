<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>W = Q·N в 3D — атомы, нуклоны и электроны</title>
  <link rel="icon" href="data:," />
  <style>
    :root {
      --bg: #000;
      --panel: rgba(8, 14, 24, .82);
      --line: rgba(120, 170, 220, .22);
      --text: #dce6f0;
      --muted: #8197ad;
      --btn: rgba(18, 28, 44, .9);
      --btn-hover: rgba(30, 46, 70, .95);
      --accent: #5ab0ff;
      --mono: "Courier New", monospace;
    }
    html, body { height: 100%; }
    body { margin: 0; background: var(--bg); overflow: hidden; font-family: var(--mono); }
    canvas { display: block; width: 100vw; height: 100vh; }
    #ui {
      position: absolute; top: 12px; left: 12px; max-width: calc(100vw - 290px);
      color: var(--text); text-shadow: 1px 1px 3px #000; line-height: 1.42;
      user-select: none; pointer-events: none; font-size: 12px;
    }
    #ui pre { margin: 0; font: inherit; white-space: pre-wrap; }
    #ui details { pointer-events: auto; margin-top: 6px; color: var(--muted); }
    #ui summary { cursor: pointer; width: max-content; }
    #panel {
      position: absolute; top: 12px; right: 12px; width: 236px; box-sizing: border-box;
      max-height: calc(100vh - 24px); overflow-y: auto;
      background: var(--panel); border: 1px solid var(--line); border-radius: 10px;
      padding: 10px 12px; color: var(--text); font-size: 12px;
    }
    #panel h2 {
      margin: 12px 0 6px; font-size: 11px; font-weight: normal; letter-spacing: .08em;
      text-transform: uppercase; color: var(--muted);
    }
    #panel h2:first-child { margin-top: 0; }
    #panel .row { display: grid; grid-template-columns: 1fr 32px 64px 32px; align-items: center; gap: 4px; margin: 4px 0; }
    #panel .lbl { font-size: 14px; }
    #panel .cnt { text-align: center; font-size: 14px; }
    #panel .cnt small { font-size: 10px; color: var(--muted); }
    #panel button {
      background: var(--btn); color: var(--text); border: 1px solid var(--line);
      border-radius: 6px; padding: 5px 6px; font: inherit; cursor: pointer; min-height: 28px;
    }
    #panel button:hover:not(:disabled) { background: var(--btn-hover); }
    #panel button:disabled { opacity: .35; cursor: default; }
    #panel button.on { border-color: var(--accent); color: var(--accent); }
    #panel .row button { font-size: 16px; padding: 0; }
    #panel .seg { display: flex; gap: 4px; }
    #panel .seg button { flex: 1; white-space: nowrap; font-size: 11px; padding: 5px 2px; }
    #gVal { white-space: pre; }
    #panel input[type=range] { width: 100%; accent-color: var(--accent); }
    #panel .note { color: var(--muted); font-size: 11px; margin: 2px 0 6px; }
    #panel details { margin-top: 12px; color: var(--muted); }
    #panel summary { cursor: pointer; }
    #panel pre { margin: 6px 0 0; font: inherit; font-size: 11px; line-height: 1.45; white-space: pre-wrap; }
    @media (max-width: 640px) {
      #panel { top: auto; bottom: 0; right: 0; left: 0; width: auto; max-height: 45vh; border-radius: 10px 10px 0 0; }
      #ui { max-width: calc(100vw - 24px); font-size: 11px; }
    }
  </style>
</head>
<body>
  <div id="ui">
    <pre id="sum"></pre>
    <details id="more"><summary>формула и N = V·q</summary><pre id="det"></pre></details>
  </div>
  <div id="panel"></div>
  <canvas id="c"></canvas>

<script type="module">
// Чистая W = Q·N: только поле тел, без кулона, кора kField, БГП и затенения.
// На старте один атом (p⁺ + n⁰ + e⁻, дейтерий); кулона нет.
// Камера: drag — вращение, колесо — масштаб.

const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
const sum = document.getElementById('sum');
const det = document.getElementById('det');
const more = document.getElementById('more');

const P = {
  G: 2.4e-43,
  r0: 1.0,
  rn: 0.45,
  focal: 620,
  camR: 6.2,
  tx: 0, ty: 0, tz: 0, camSpeed: 4,
  ox: 0, oy: 0, oz: 0,
  yaw: 0.5,
  pitch: 0.28,
  paused: false,
  timeScale: 1.0,
  showField: false,
};

const M_P = 1836, M_E = 1, M_N = 1839;
// Токовые массы кварков (Стандартная модель): u ≈ 2.16 МэВ, d ≈ 4.67 МэВ; mₑ = 0.511 МэВ.
const M_U = 2.16 / 0.511, M_D = 4.67 / 0.511;
// Остальные ~99% массы нуклона — энергия связи сильного взаимодействия; в модели это
// отдельное тело «масса связи» в центре нуклона. Сумма даёт ровно M_P и M_N.
const M_CORE_P = M_P - 2 * M_U - M_D;
const M_CORE_N = M_N - M_U - 2 * M_D;
const QUARKS = { p: ['u', 'u', 'd'], n: ['u', 'd', 'd'] };

// Формула: W = Q·N, Q = k_a·C1/(4πR²), N = V·q = h·S·q, F = f(α)·n_f·W, n_f = k_v·h·S·q.
// Для тяготения k_a = k_v = f(α) = 1, C1 = 4πG ⇒ F = G·m1·m2/R².
const K_A = 1, K_V = 1, F_ALPHA = 1;
P.C1 = 4 * Math.PI * P.G;
const Q = (r) => K_A * P.C1 / (4 * Math.PI * r * r);
const kQ = () => K_A * P.C1 / (4 * Math.PI); // Q·r²

// Частица — сфера радиуса rad: S = πr², h = V/S = 4r/3, V = hS, N = Vq.
// Плотность q одна для всех (калибрована по N(e⁻) = 1), радиус — из N = V·q.
const RAD_E = 0.01;
const sphereV = (r) => (4 / 3) * Math.PI * r * r * r;
const Q_DENS = M_E / sphereV(RAD_E);
const radOf = (N) => Math.cbrt(N / (Q_DENS * (4 / 3) * Math.PI));
const RAD_P = radOf(M_CORE_P);
const RAD_N = radOf(M_CORE_N);
P.radE = RAD_E;
P.radP = RAD_P;
P.radN = RAD_N;
P.qE = P.qP = P.qN = Q_DENS;
P.mP = M_P;
P.mE = M_E;
P.mN = M_N;
function bodyProps(rad, q) {
  const S = Math.PI * rad * rad;
  const h = 4 * rad / 3;
  const V = h * S;
  const N = V * q;
  return { rad, q, S, h, V, N };
}
const SPECIES = {
  // p, n — масса связи нуклона; кварки u, d — отдельные тела внутри неё
  p: { rad: RAD_P, q: Q_DENS, color: '255,150,80', core: '#fff3e0', glow: 2, alpha: 0.45, label: 'p⁺' },
  n: { rad: RAD_N, q: Q_DENS, color: '200,205,215', core: '#f2f4f8', glow: 2, alpha: 0.5, label: 'n⁰' },
  e: { rad: RAD_E, q: Q_DENS, color: '80,230,255', core: '#eaffff', glow: 3, alpha: 0.9, label: 'e⁻' },
  u: { rad: radOf(M_U), q: Q_DENS, color: '255,90,120', core: '#ffd6de', glow: 3, alpha: 0.9, label: 'u' },
  d: { rad: radOf(M_D), q: Q_DENS, color: '120,255,140', core: '#dcffe0', glow: 3, alpha: 0.9, label: 'd' },
};
let nextNuc = 0;
function makeBody(kind, atom, pos, vel = [0, 0, 0]) {
  const sp = SPECIES[kind];
  const props = bodyProps(sp.rad, sp.q);
  // инерция = n_f = k_v·h·S·q (для тяготения заряд — масса)
  return { kind, atom, ...props, m: K_V * props.N, p: [...pos], v: [...vel], trail: [] };
}
// Нуклон = масса связи + три кварка на орбитах внутри неё; держит их только W = Q·N.
function makeNucleon(kind, atom, pos) {
  const nuc = nextNuc++;
  const core = makeBody(kind, atom, pos);
  core.nuc = nuc;
  const body = [core];
  for (const f of QUARKS[kind]) {
    const q = orbit([makeBody(f, atom, pos)], [core], 0.6 * core.rad)[0];
    q.nuc = nuc;
    body.push(q);
  }
  return body;
}

// Q_j·N_j в точке на расстоянии r. Внутри шара радиуса R действует только
// заряд, попавший внутрь: N(r) = V(r)·q = N·(r/R)³ — та же N = Vq, без обрезки r.
function QN(r, R, Nj) {
  if (r <= 0) return 0;
  return Q(r) * (r >= R ? Nj : Nj * (r / R) ** 3);
}
// Потенциал пары (на kQ·N_i·N_j), согласованный с QN: −dφ/dr = QN/(kQ·N_j).
function phi(r, R) {
  return r >= R ? 1 / r : (3 * R * R - r * r) / (2 * R * R * R);
}

// Центр масс, суммарные N и m набора тел.
function lump(bodies) {
  let N = 0, m = 0, R = 0;
  const c = [0, 0, 0], cv = [0, 0, 0];
  for (const b of bodies) {
    N += b.N; m += b.m; R = Math.max(R, b.rad);
    for (let k = 0; k < 3; k++) { c[k] += b.m * b.p[k]; cv[k] += b.m * b.v[k]; }
  }
  for (let k = 0; k < 3; k++) { c[k] /= m; cv[k] /= m; }
  return { N, m, R, c, cv };
}
// Круговая орбита составного тела `moving` вокруг группы `group` из той же формулы:
// a = QN(r, R, 1)·(N_b·N_g/m_b + N_g·N_b/m_g) = v²/r, где QN учитывает и орбиту
// внутри шара (N(r) = V(r)·q). Все тела `moving` сдвигаются одинаково, импульс
// делится между ним и группой, так что суммарный импульс не меняется.
function orbit(moving, group, r) {
  const b = lump(moving), g = lump(group);
  const n = norm(randDir());
  const u = norm(cross(n, randDir()));
  const t = norm(cross(n, u));
  const aRel = QN(r, Math.max(b.R, g.R), 1) * (b.N * g.N / b.m + g.N * b.N / g.m);
  const vRel = Math.sqrt(aRel * r);
  const mt = g.m + b.m;
  // скорость общего центра масс до и после одна и та же
  const V = [0, 1, 2].map((k) => (b.m * b.cv[k] + g.m * g.cv[k]) / mt);
  const dp = [0, 1, 2].map((k) => g.c[k] + u[k] * r - b.c[k]);
  const dvb = [0, 1, 2].map((k) => V[k] + t[k] * vRel * g.m / mt - b.cv[k]);
  const dvg = [0, 1, 2].map((k) => V[k] - t[k] * vRel * b.m / mt - g.cv[k]);
  for (const x of moving) {
    for (let k = 0; k < 3; k++) { x.p[k] += dp[k]; x.v[k] += dvb[k]; }
  }
  for (const x of group) {
    for (let k = 0; k < 3; k++) x.v[k] += dvg[k];
  }
  return moving;
}

function randDir() {
  const u = Math.random(), v = Math.random();
  const th = 2 * Math.PI * u, ph = Math.acos(2 * v - 1);
  const s = Math.sin(ph);
  return [Math.cos(th) * s, Math.sin(th) * s, Math.cos(ph)];
}
function cross(a, b) {
  return [a[1] * b[2] - a[2] * b[1], a[2] * b[0] - a[0] * b[2], a[0] * b[1] - a[1] * b[0]];
}
function norm(a) {
  const l = Math.hypot(a[0], a[1], a[2]) || 1;
  return [a[0] / l, a[1] / l, a[2] / l];
}

// Атом дейтерия: p⁺ в покое, n⁰ на орбите rn вокруг p⁺, e⁻ на орбите r0 вокруг p⁺+n⁰.
// p⁺ и n⁰ — составные: масса связи + кварки.
function makeAtom(atom, base) {
  const p = makeNucleon('p', atom, base);
  const n = orbit(makeNucleon('n', atom, base), p, P.rn);
  const e = orbit([makeBody('e', atom, base)], [...p, ...n], P.r0);
  return [...p, ...n, ...e];
}
function makeParts() {
  return makeAtom(0, [0, 0, 0]);
}
let parts = makeParts();
let time = 0;
let nextAtom = 1;

// Состав системы. Тела с atom = −1 — свободные (без орбиты, в покое).
let E0 = null; // E на момент последнего изменения состава или G — от него считается ΔE/E
const changed = () => { E0 = null; };
const isNucleon = (q) => q.kind === 'p' || q.kind === 'n';
const isQuark = (q) => q.kind === 'u' || q.kind === 'd';
const atomIds = () => [...new Set(parts.filter((q) => q.kind === 'p' && q.atom >= 0).map((q) => q.atom))];
const isFree = (kind) => (q) => q.kind === kind && q.atom === -1;
function removeLast(pred) {
  for (let i = parts.length - 1; i >= 0; i--) {
    if (pred(parts[i])) { parts.splice(i, 1); changed(); return; }
  }
}
// Нуклон удаляется целиком: масса связи и все его кварки.
function removeNucleon(pred) {
  for (let i = parts.length - 1; i >= 0; i--) {
    if (isNucleon(parts[i]) && pred(parts[i])) {
      const nuc = parts[i].nuc;
      parts = parts.filter((q) => q.nuc !== nuc);
      changed();
      return;
    }
  }
}
function centerOfMass() {
  let mx = 0, my = 0, mz = 0, mm = 0;
  for (const p of parts) { mx += p.m * p.p[0]; my += p.m * p.p[1]; mz += p.m * p.p[2]; mm += p.m; }
  return mm ? [mx / mm, my / mm, mz / mm] : [0, 0, 0];
}
function nearCOM(rMin, rMax) {
  const c = centerOfMass(), d = randDir();
  const r = rMin + Math.random() * (rMax - rMin);
  return [c[0] + d[0] * r, c[1] + d[1] * r * 0.4, c[2] + d[2] * r];
}

function addAtom() {
  parts.push(...makeAtom(nextAtom++, nearCOM(2.3, 3.5)));
  changed();
}
function removeAtom() {
  const ids = atomIds();
  if (!ids.length) return;
  const atom = ids[ids.length - 1];
  for (let i = parts.length - 1; i >= 0; i--) {
    if (parts[i].atom === atom) parts.splice(i, 1);
  }
  changed();
}
function addNeutron() {
  const ids = atomIds();
  if (!ids.length) return;
  const withN = new Set(parts.filter((q) => q.kind === 'n').map((q) => q.atom));
  const atom = ids.find((a) => !withN.has(a)) ?? ids[ids.length - 1];
  const nucleus = parts.filter((q) => q.kind !== 'e' && q.atom === atom);
  const index = nucleus.filter((q) => q.kind === 'n').length;
  const host = nucleus[0];
  parts.push(...orbit(makeNucleon('n', atom, host.p), nucleus, P.rn * (1 + 0.35 * index)));
  changed();
}
const removeNeutron = () => removeNucleon((q) => q.kind === 'n');
function addProton() {
  parts.push(...makeNucleon('p', -1, nearCOM(1.5, 3)));
  changed();
}
const removeProton = () => removeNucleon(isFree('p'));
function addElectron() {
  parts.push(makeBody('e', -1, nearCOM(0.8, 2.2)));
  changed();
}
const removeElectron = () => removeLast(isFree('e'));
function reset() {
  nextNuc = 0;
  parts = makeParts(); time = 0; nextAtom = 1;
  changed();
}
function setG(G) {
  P.G = G;
  P.C1 = 4 * Math.PI * G;
  changed();
}

// ---------- панель ----------
const G_HONEST = 2.4e-43;
const OPS = {
  p: [removeProton, addProton],
  n: [removeNeutron, addNeutron],
  e: [removeElectron, addElectron],
  a: [removeAtom, addAtom],
};
const ROW_TIPS = {
  p: '+ свободный протон (u u d) в покое рядом с центром масс\n− убирает последний свободный протон вместе с кварками',
  n: '+ нейтрон (u d d) на орбиту вокруг ядра атома\n− убирает последний нейтрон вместе с кварками',
  e: '+ свободный электрон в покое рядом с центром масс\n− убирает последний свободный электрон',
  a: '+ атом дейтерия p⁺ + n⁰ + e⁻\n− убирает последний атом целиком',
};
const panel = document.getElementById('panel');
function makePanel() {
  const row = (k, label) =>
    `<div class="row" data-k="${k}" title="${ROW_TIPS[k]}"><span class="lbl">${label}</span>` +
    `<button data-op="0" aria-label="убрать ${label}">−</button><span class="cnt"></span>` +
    `<button data-op="1" aria-label="добавить ${label}">+</button></div>`;
  panel.innerHTML =
    `<h2>Частицы</h2>${row('p', 'p⁺')}${row('n', 'n⁰')}${row('e', 'e⁻')}${row('a', 'атом')}` +
    `<h2>Постоянная G</h2>` +
    `<input id="gSl" type="range" min="-45" max="6" step="0.01" aria-label="log10 G">` +
    `<div id="gVal" class="note"></div>` +
    `<div class="seg"><button data-g="${G_HONEST}">честный</button><button data-g="1e-5">демо</button><button data-g="1">1</button></div>` +
    `<h2>Симуляция</h2>` +
    `<div class="seg"><button id="bPause"></button><button id="bReset">⟳ сброс</button><button id="bField">поле</button></div>` +
    `<details><summary>? подсказки</summary><pre id="help"></pre></details>`;

  panel.addEventListener('click', (e) => {
    const b = e.target.closest('button');
    if (!b) return;
    b.blur(); // чтобы Space не нажимал кнопку повторно
    if (b.dataset.op) OPS[b.closest('.row').dataset.k][+b.dataset.op]();
    else if (b.dataset.g) setG(Number(b.dataset.g));
    else if (b.id === 'bPause') P.paused = !P.paused;
    else if (b.id === 'bReset') reset();
    else if (b.id === 'bField') P.showField = !P.showField;
  });
  panel.querySelector('#gSl').addEventListener('input', (e) => setG(Math.pow(10, Number(e.target.value))));
}
function syncPanel(c) {
  const free = { p: c.pFree, e: c.eFree };
  const total = { p: c.p, n: c.n, e: c.e, a: c.a };
  const canDel = { p: c.pFree > 0, n: c.n > 0, e: c.eFree > 0, a: c.a > 0 };
  for (const r of panel.querySelectorAll('.row')) {
    const k = r.dataset.k;
    r.querySelector('.cnt').innerHTML = total[k] + (free[k] ? `<small> св ${free[k]}</small>` : '');
    r.querySelector('[data-op="0"]').disabled = !canDel[k];
  }
  panel.querySelector('[data-k="n"] [data-op="1"]').disabled = c.a === 0;
  const sl = panel.querySelector('#gSl');
  if (document.activeElement !== sl) sl.value = Math.log10(P.G).toFixed(2);
  panel.querySelector('#gVal').textContent = `G = ${P.G.toExponential(2)}\nC1 = 4πG = ${P.C1.toExponential(2)}`;
  for (const b of panel.querySelectorAll('[data-g]')) b.classList.toggle('on', Number(b.dataset.g) === P.G);
  panel.querySelector('#bPause').textContent = P.paused ? '▶ пуск' : '⏸ пауза';
  panel.querySelector('#bField').classList.toggle('on', P.showField);
}
// W_i = Σ_j Q_j·N_j (вектор к источнику), F_i = f(α)·n_f·W_i, n_f = k_v·N_i, a_i = F_i/m_i.
function accelerate() {
  const a = parts.map(() => [0, 0, 0]);
  for (let i = 0; i < parts.length; i++) {
    const A = parts[i];
    let Wx = 0, Wy = 0, Wz = 0;
    for (let j = 0; j < parts.length; j++) {
      if (j === i) continue;
      const B = parts[j];
      const rx = B.p[0] - A.p[0], ry = B.p[1] - A.p[1], rz = B.p[2] - A.p[2];
      const r = Math.hypot(rx, ry, rz);
      if (r === 0) continue;
      const w = QN(r, Math.max(A.rad, B.rad), B.N);
      Wx += w * rx / r; Wy += w * ry / r; Wz += w * rz / r;
    }
    const F = F_ALPHA * K_V * A.N;
    a[i][0] = F * Wx / A.m;
    a[i][1] = F * Wy / A.m;
    a[i][2] = F * Wz / A.m;
  }
  return a;
}


// Динамическое время самой тесной пары из той же формулы: t = √(r³ / (kQ·(N_i+N_j))).
function dynTime() {
  let t = Infinity;
  for (let i = 0; i < parts.length; i++) {
    for (let j = i + 1; j < parts.length; j++) {
      const A = parts[i], B = parts[j];
      const r = Math.max(Math.max(A.rad, B.rad),
        Math.hypot(B.p[0] - A.p[0], B.p[1] - A.p[1], B.p[2] - A.p[2]));
      t = Math.min(t, Math.sqrt(r * r * r / (kQ() * (A.N + B.N))));
    }
  }
  return t;
}

function step(dt) {
  const a0 = accelerate();
  for (let i = 0; i < parts.length; i++) {
    const p = parts[i];
    p.v[0] += 0.5 * a0[i][0] * dt; p.v[1] += 0.5 * a0[i][1] * dt; p.v[2] += 0.5 * a0[i][2] * dt;
    p.p[0] += p.v[0] * dt; p.p[1] += p.v[1] * dt; p.p[2] += p.v[2] * dt;
  }
  const a1 = accelerate();
  for (let i = 0; i < parts.length; i++) {
    const p = parts[i];
    p.v[0] += 0.5 * a1[i][0] * dt; p.v[1] += 0.5 * a1[i][1] * dt; p.v[2] += 0.5 * a1[i][2] * dt;
    if (p.kind === 'e') {
      p.trail.push([p.p[0], p.p[1], p.p[2]]);
      if (p.trail.length > 375) p.trail.shift();
    }
  }
  time += dt;
}
// ---------- 3D → экран ----------
let W = 0, H = 0, dpr = 1;
function resize() {
  dpr = Math.max(1, Math.min(2, devicePixelRatio || 1));
  canvas.width = Math.floor(innerWidth * dpr);
  canvas.height = Math.floor(innerHeight * dpr);
  W = innerWidth; H = innerHeight;
}
addEventListener('resize', resize);
resize();

function project(p) {
  const cy = Math.cos(P.yaw), sy = Math.sin(P.yaw);
  const cp = Math.cos(P.pitch), sp = Math.sin(P.pitch);
  const px = p[0] - P.tx, py = p[1] - P.ty, pz = p[2] - P.tz;
  const x1 = px * cy - pz * sy;
  const z1 = px * sy + pz * cy;
  const y1 = py;
  const y2 = y1 * cp - z1 * sp;
  const z2 = y1 * sp + z1 * cp;
  const zc = z2 + P.camR;
  if (zc < 0.2) return null;
  const s = P.focal / zc;
  return [W / 2 + x1 * s, H / 2 - y2 * s, zc, s];
}

function glow(x, y, r, rgb, a) {
  const g = ctx.createRadialGradient(x, y, 0, x, y, r);
  g.addColorStop(0, `rgba(${rgb},${a})`);
  g.addColorStop(0.45, `rgba(${rgb},${a * 0.5})`);
  g.addColorStop(1, `rgba(${rgb},0)`);
  ctx.fillStyle = g;
  ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI * 2); ctx.fill();
}

// Свечение = Q_j·N_j тела, отнесённое к полю протона на r0: та же QN, что и в динамике.
function drawField() {
  ctx.globalCompositeOperation = 'lighter';
  const W0 = QN(P.r0, 0, P.mP);
  const cut = 0.02;
  for (let idx = 0; idx < parts.length; idx++) {
    const pt = parts[idx];
    const s = project(pt.p);
    if (!s) continue;
    const worldR = P.r0 * Math.sqrt(pt.N / P.mP / cut);
    const screenR = worldR * s[3];
    if (!(screenR > 4)) continue;
    const g = ctx.createRadialGradient(s[0], s[1], 0, s[0], s[1], screenR);
    const rgb = pt.atom === 0 ? '90,170,255' : '255,160,90';
    for (let k = 0; k <= 20; k++) {
      const kk = k / 20;
      const a = Math.min(0.35, 0.35 * QN(kk * worldR, pt.rad, pt.N) / W0);
      g.addColorStop(kk, 'rgba(' + rgb + ',' + a.toFixed(4) + ')');
    }
    ctx.fillStyle = g;
    ctx.beginPath();
    ctx.arc(s[0], s[1], screenR, 0, Math.PI * 2);
    ctx.fill();
  }
  ctx.globalCompositeOperation = 'source-over';
}
function draw() {
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  ctx.clearRect(0, 0, W, H);
  ctx.fillStyle = '#000';
  ctx.fillRect(0, 0, W, H);
  if (P.showField) drawField();

  // следы электронов
  for (const e of parts) {
    if (e.kind !== 'e') continue;
    for (let i = 1; i < e.trail.length; i++) {
      const A = project(e.trail[i - 1]), B = project(e.trail[i]);
      if (!A || !B) continue;
      const t = i / e.trail.length;
      ctx.strokeStyle = `rgba(80,220,255,${0.10 * t})`;
      ctx.lineWidth = 1.5;
      ctx.beginPath(); ctx.moveTo(A[0], A[1]); ctx.lineTo(B[0], B[1]); ctx.stroke();
    }
  }

  // линия между протонами
  const pps = parts.filter((p) => p.kind === 'p');
  const s0 = pps[0] ? project(pps[0].p) : null;
  const s1 = pps[1] ? project(pps[1].p) : null;
  if (s0 && s1) {
    ctx.strokeStyle = 'rgba(160,190,220,.25)';
    ctx.setLineDash([4, 5]);
    ctx.beginPath(); ctx.moveTo(s0[0], s0[1]); ctx.lineTo(s1[0], s1[1]); ctx.stroke();
    ctx.setLineDash([]);
  }

  // частицы: экранный радиус = rad * s — в масштабе объёма
  // кварки рисуются после масс связи — поверх, чтобы их было видно внутри нуклона
  for (const kind of ['p', 'n', 'e', 'u', 'd']) {
    const sp = SPECIES[kind];
    for (const pt of parts) {
      if (pt.kind !== kind) continue;
      const s = project(pt.p);
      if (!s) continue;
      const rr = Math.max(0.7, pt.rad * s[3]);
      glow(s[0], s[1], Math.max(rr * sp.glow, 1.5), sp.color, sp.alpha);
      ctx.fillStyle = sp.core;
      ctx.beginPath(); ctx.arc(s[0], s[1], rr, 0, Math.PI * 2); ctx.fill();
    }
  }

  // подписи
  ctx.font = '12px "Courier New"';
  ctx.fillStyle = '#9fb0c2';
  for (const pt of parts) {
    const s = project(pt.p);
    if (!s) continue;
    if (isQuark(pt)) {
      // u/d подписываются, только когда нуклон крупно на экране
      if (RAD_P * s[3] < 25) continue;
      // подпись лежит на светлом диске нуклона — тёмным цветом
      ctx.font = 'bold 11px "Courier New"';
      ctx.fillStyle = '#1b2533';
      ctx.fillText(SPECIES[pt.kind].label, s[0] + 4, s[1] - 4);
      ctx.font = '12px "Courier New"';
      ctx.fillStyle = '#9fb0c2';
      continue;
    }
    const dy = Math.max(12, pt.rad * s[3] + 10);
    ctx.fillText(SPECIES[pt.kind].label, s[0] - 6, s[1] - dy);
  }

  return { s0, s1 };
}

// камера
let dragging = false, lx = 0, ly = 0;
canvas.addEventListener('pointerdown', (e) => { dragging = true; lx = e.clientX; ly = e.clientY; });
canvas.addEventListener('pointerup', () => { dragging = false; });
canvas.addEventListener('pointercancel', () => { dragging = false; });
canvas.addEventListener('pointermove', (e) => {
  if (!dragging) return;
  P.yaw += (e.clientX - lx) * 0.006;
  P.pitch = Math.max(-1.4, Math.min(1.4, P.pitch + (e.clientY - ly) * 0.006));
  lx = e.clientX; ly = e.clientY;
});
canvas.addEventListener('wheel', (e) => {
  P.camR = Math.max(0.8, Math.min(20, P.camR * (1 + e.deltaY * 0.001)));
  e.preventDefault();
}, { passive: false });

// цикл
let last = performance.now();
let simAcc = 0;
let FIXED = 1 / 120;
let fps = 0, fpsN = 0, fpsT = performance.now();

// E = KE + U, U = −kQ·N_i·N_j·φ(r): потенциал той же силы, что в accelerate().
function totalEnergy() {
  let E = 0;
  const px = [0, 0, 0];
  for (const p of parts) {
    E += 0.5 * p.m * (p.v[0] * p.v[0] + p.v[1] * p.v[1] + p.v[2] * p.v[2]);
    for (let k = 0; k < 3; k++) px[k] += p.m * p.v[k];
  }
  for (let i = 0; i < parts.length; i++) {
    for (let j = i + 1; j < parts.length; j++) {
      const A = parts[i], B = parts[j];
      const r = Math.hypot(B.p[0] - A.p[0], B.p[1] - A.p[1], B.p[2] - A.p[2]);
      E -= F_ALPHA * K_V * kQ() * A.N * B.N * phi(r, Math.max(A.rad, B.rad));
    }
  }
  return { E, Pm: Math.hypot(px[0], px[1], px[2]) };
}

function frame() {
  const now = performance.now();
  const realDt = Math.min((now - last) / 1000, 0.05);
  last = now;

  if (!P.paused) {
    FIXED = Math.min(1 / 120, 0.02 * dynTime());
    simAcc += realDt * P.timeScale;
    let n = 0;
    while (simAcc >= FIXED && n < 400) { step(FIXED); simAcc -= FIXED; n++; }
    if (n === 400) simAcc = 0;
  }

  const cy2 = Math.cos(P.yaw), sy2 = Math.sin(P.yaw);
  const fwd = (keys['w'] ? 1 : 0) - (keys['s'] ? 1 : 0);
  const rgt = (keys['d'] ? 1 : 0) - (keys['a'] ? 1 : 0);
  const up2 = (keys['e'] ? 1 : 0) - (keys['q'] ? 1 : 0);
  if (fwd || rgt || up2) {
    const sp2 = P.camSpeed * realDt;
    P.ox += (fwd * -cy2 + rgt * -sy2) * sp2;
    P.oz += (fwd * -sy2 + rgt * -cy2) * sp2;
    P.oy += up2 * sp2;
  }

  const c = centerOfMass();
  const kf = 1 - Math.exp(-realDt * 3);
  P.tx += (c[0] + P.ox - P.tx) * kf;
  P.ty += (c[1] + P.oy - P.ty) * kf;
  P.tz += (c[2] + P.oz - P.tz) * kf;

  draw();

  fpsN++;
  if (now - fpsT > 500) { fps = fpsN / ((now - fpsT) / 1000); fpsN = 0; fpsT = now; }

  const protons = parts.filter((q) => q.kind === 'p');
  const neutrons = parts.filter((q) => q.kind === 'n');
  const electrons = parts.filter((q) => q.kind === 'e');
  const p0 = protons[0], n0 = neutrons[0];
  let R = 0;
  for (let i = 0; i < protons.length; i++) {
    for (let j = i + 1; j < protons.length; j++) {
      const d = Math.hypot(protons[j].p[0] - protons[i].p[0], protons[j].p[1] - protons[i].p[1], protons[j].p[2] - protons[i].p[2]);
      if (!R || d < R) R = d;
    }
  }
  const Rn = (p0 && n0)
    ? Math.hypot(n0.p[0] - p0.p[0], n0.p[1] - p0.p[1], n0.p[2] - p0.p[2])
    : 0;
  const vn = (p0 && n0)
    ? Math.hypot(n0.v[0] - p0.v[0], n0.v[1] - p0.v[1], n0.v[2] - p0.v[2])
    : 0;
  const quarks = parts.filter(isQuark);
  const nucLine = (label, kind, core, total) => {
    const f = QUARKS[kind];
    const nu = f.filter((x) => x === 'u').length, nd = f.length - nu;
    const mul = (k, M) => (k > 1 ? `${k}·` : '') + M.toFixed(2);
    return `${label} = ${f.join(' ')}: N = ${core.toFixed(1)} (связь) + ${mul(nu, M_U)} (u) + ${mul(nd, M_D)} (d) = ${total}`;
  };
  const rnLine = n0 ? `\nR(p–n) = ${Rn.toFixed(2)} a₀ · v=${vn.toExponential(2)}` : '';
  const en = totalEnergy();
  if (E0 === null) E0 = en.E;
  const dE = E0 ? (en.E - E0) / Math.abs(E0) : 0;
  const counts = {
    p: protons.length, n: neutrons.length, e: electrons.length, a: atomIds().length,
    pFree: protons.filter((q) => q.atom === -1).length,
    eFree: electrons.filter((q) => q.atom === -1).length,
  };
  sum.textContent =
`W = Q·N · 3D${P.paused ? ' · пауза' : ''}
p⁺ ${counts.p} · n⁰ ${counts.n} · e⁻ ${counts.e} · A ${counts.p + counts.n} · Z ${counts.p}
кварки: u ${quarks.filter((q) => q.kind === 'u').length} · d ${quarks.filter((q) => q.kind === 'd').length} · тел ${parts.length}
E = ${en.E.toExponential(4)} · ΔE/E = ${dE.toExponential(1)}
t = ${time.toFixed(1)} · FPS = ${fps.toFixed(0)}`;
  if (more.open) det.textContent =
`воздействие = качество × количество
Q = k_a·C1/(4πR²) — качество; N = V·q = h·S·q — количество (заряд)
W = Σ Q_j·N_j; F = f(α)·n_f·W, n_f = k_v·N; a = F/m
k_a = k_v = f(α) = 1 · C1 = 4πG = ${P.C1.toExponential(2)}
q = ${Q_DENS.toExponential(2)} у всех тел; N = V·q
${nucLine('p⁺', 'p', M_CORE_P, M_P)}
${nucLine('n⁰', 'n', M_CORE_N, M_N)}
e⁻ — элементарен: N = ${M_E}
кварки держит только W = Q·N массы связи (сильного взаимодействия нет)
R(p–p, min) = ${R ? R.toFixed(2) : '—'} a₀${rnLine}
|p| = ${en.Pm.toExponential(1)} · сложность O(N²)
без кулона, кора, БГП и тени`;
  syncPanel(counts);

requestAnimationFrame(frame);
}

const keys = {};
addEventListener('keydown', (e) => {
  if (e.target.tagName === 'INPUT') return;
  keys[e.key.toLowerCase()] = true;
  if (e.code === 'Space') { P.paused = !P.paused; e.preventDefault(); }
  if (e.key.toLowerCase() === 'r') reset();
  if (e.key.toLowerCase() === 'g') P.showField = !P.showField;
});
addEventListener('keyup', (e) => { keys[e.key.toLowerCase()] = false; });

makePanel();
document.getElementById('help').textContent =
`мышь: drag — вращение, колесо — масштаб
WASD — смещение, Q/E — вверх/вниз
камера следит за центром масс
Space — пауза · R — сброс · G — поле

Только W = Q·N: гравитация тел, без кулона, кора, БГП и тени.
Начальные скорости — круговые орбиты из той же формулы (a = Q·N = v²/r).
Свободные p⁺ и e⁻ появляются в покое; дальше их ведёт только W.
Нейтрон держится только гравитацией; сильного взаимодействия нет.
p⁺ = u u d, n⁰ = u d d: кварки (~1% массы) обращаются внутри
«массы связи» (~99%), их держит только W = Q·N. e⁻ элементарен.
Приблизьте колесом при «демо» — u/d видно внутри нуклонов.
При честном G движение невидимо — включите «демо» и нажмите сброс.
Масштаб m_p=1836, m_n=1839, m_e=1. Числа модельные, не СИ.`;
requestAnimationFrame(frame);

window.__h2d = {
  P, Q, QN, makeBody, makeNucleon, accelerate, step, totalEnergy, dynTime, reset,
  M: { M_P, M_N, M_U, M_D, M_CORE_P, M_CORE_N, RAD_P, RAD_N },
  get parts() { return parts; },
  set parts(v) { parts = v; },
  get R() {
    const ps = parts.filter((q) => q.kind === 'p');
    return ps.length > 1 ? Math.hypot(ps[1].p[0] - ps[0].p[0], ps[1].p[1] - ps[0].p[1], ps[1].p[2] - ps[0].p[2]) : 0;
  },
  get A() { return parts.filter(isNucleon).length; },
  get Z() { return parts.filter((q) => q.kind === 'p').length; },
  get time() { return time; },
};
</script>
</body>
