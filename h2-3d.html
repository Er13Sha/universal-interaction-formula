<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>W = Q·N в 3D — атомы, нуклоны и электроны</title>
  <link rel="icon" href="data:," />
  <style>
    :root {
      --bg: #000;
      --panel: rgba(8, 14, 24, .82);
      --line: rgba(120, 170, 220, .22);
      --text: #dce6f0;
      --muted: #8197ad;
      --btn: rgba(18, 28, 44, .9);
      --btn-hover: rgba(30, 46, 70, .95);
      --accent: #5ab0ff;
      --mono: "Courier New", monospace;
      --fs: 13px;       /* единый размер шрифта интерфейса */
      --panel-w: 320px; /* ширина правой панели */
    }
    html, body { height: 100%; }
    body { margin: 0; background: var(--bg); overflow: hidden; font-family: var(--mono); font-size: var(--fs); }
    canvas { display: block; width: 100vw; height: 100vh; }
    #ui {
      position: absolute; top: 12px; left: 12px; max-width: calc(100vw - var(--panel-w) - 48px);
      color: var(--text); text-shadow: 1px 1px 3px #000; line-height: 1.45;
      user-select: none; pointer-events: none; font-size: var(--fs);
    }
    #ui pre { margin: 0; font: inherit; white-space: pre-wrap; }
    #ui details { pointer-events: auto; margin-top: 6px; color: var(--muted); }
    #ui summary { cursor: pointer; width: max-content; }
    #panel {
      position: absolute; top: 12px; right: 12px; width: var(--panel-w); box-sizing: border-box;
      max-height: calc(100vh - 24px); overflow-y: auto; overflow-x: hidden;
      background: var(--panel); border: 1px solid var(--line); border-radius: 10px;
      padding: 10px 12px; color: var(--text); font-size: var(--fs); line-height: 1.4;
    }
    #panel h2 {
      margin: 14px 0 6px; font-size: var(--fs); font-weight: normal; letter-spacing: .06em;
      text-transform: uppercase; color: var(--muted);
    }
    #panel h2:first-child { margin-top: 0; }
    #panel .row { display: grid; grid-template-columns: 1fr 32px 64px 32px; align-items: center; gap: 4px; margin: 4px 0; }
    #panel .row[hidden] { display: none; }
    #panel .lbl { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    #panel .sym { color: var(--muted); }
    #panel .cnt { text-align: center; white-space: nowrap; }
    #panel .cnt small { font-size: var(--fs); color: var(--muted); }
    #panel button {
      background: var(--btn); color: var(--text); border: 1px solid var(--line);
      border-radius: 6px; padding: 5px 6px; font: inherit; font-size: var(--fs); cursor: pointer; min-height: 30px;
    }
    #panel button:hover:not(:disabled) { background: var(--btn-hover); }
    #panel button:disabled { opacity: .35; cursor: default; }
    #panel button.on { border-color: var(--accent); color: var(--accent); }

    #gVal, #chVal { white-space: pre; }

    #chBox[hidden] { display: none; }
    #panel input[type=range] { width: 100%; accent-color: var(--accent); margin: 4px 0 0; }
    #panel .note { color: var(--muted); margin: 2px 0 6px; }
    #panel details { margin-top: 12px; color: var(--muted); }
    #panel summary { cursor: pointer; }
    #panel pre { margin: 6px 0 0; font: inherit; line-height: 1.45; white-space: pre-wrap; }
    #info {
      position: absolute; left: 12px; right: calc(var(--panel-w) + 24px); bottom: 12px; box-sizing: border-box;
      background: var(--panel); border: 1px solid var(--line); border-radius: 10px;
      padding: 8px 12px; color: var(--text); font-size: var(--fs);
    }
    #info summary { cursor: pointer; color: var(--muted); letter-spacing: .06em; text-transform: uppercase; }
    #cards { display: flex; gap: 8px; overflow-x: auto; margin-top: 8px; padding-bottom: 4px; }
    .card {
      flex: 0 0 260px; border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px;
      background: rgba(18, 28, 44, .6); line-height: 1.45;
    }
    .card.absent { opacity: .55; }
    .card h3 { margin: 0 0 4px; font-size: var(--fs); font-weight: bold; display: flex; align-items: center; gap: 6px; }
    .card h3 .dot { width: 9px; height: 9px; border-radius: 50%; flex: none; }
    .card h3 .sym { color: var(--muted); font-weight: normal; }
    .card h3 .n { margin-left: auto; color: var(--muted); font-weight: normal; white-space: nowrap; }
    .card p { margin: 0; color: var(--muted); }
    @media (max-width: 640px) {
      #info { right: 12px; bottom: calc(45vh + 8px); max-height: 30vh; overflow-y: auto; }
      #panel { top: auto; bottom: 0; right: 0; left: 0; width: auto; max-height: 45vh; border-radius: 10px 10px 0 0; }
      #ui { max-width: calc(100vw - 24px); }
      .card { flex-basis: 240px; }
    }
  </style>
</head>
<body>
  <div id="ui">
    <pre id="sum"></pre>
    <details id="more"><summary>формула и N = V·q</summary><pre id="det"></pre></details>
  </div>
  <div id="panel"></div>
  <div id="info"><details id="infoBox" open><summary>Описание частиц</summary><div id="cards"></div></details></div>
  <canvas id="c"></canvas>

<script type="module">
// Чистая W = Q·N: только поле тел, без кулона, кора kField, БГП и затенения.
// На старте один атом (p⁺ + n⁰ + e⁻, дейтерий); кулона нет.
// Камера: drag — вращение, колесо — масштаб.

const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
const sum = document.getElementById('sum');
const det = document.getElementById('det');
const more = document.getElementById('more');

const P = {
  G: 2.4e-43,
  r0: 1.0,
  rn: 0.45,
  scene: 'atoms', // 'atoms' — старт с атомом; 'sandbox' — пусто, частицы по одной
  focal: 620,
  camR: 6.2,
  tx: 0, ty: 0, tz: 0, camSpeed: 4,
  ox: 0, oy: 0, oz: 0,
  yaw: 0.5,
  pitch: 0.28,
  paused: false,
  timeScale: 1.0,
  showField: false,
  showTrail: true,
};

const M_P = 1836, M_E = 1, M_N = 1839;
// Точек в следе частицы (по одной на шаг интегрирования). Яркость падает линейно с
// возрастом точки до нуля на TRAIL_LEN: вдвое больше — затухание вдвое медленнее.
const TRAIL_LEN = 2 * 3 * 375;
const TRAIL_SLACK = 250; // лишние точки срезаются пачкой, а не shift() на каждом шаге
// В модели только частицы, доказанные напрямую и с измеренной массой: p⁺, n⁰, e⁻.

// Формула: W = Q·N, Q = k_a·C1/(4πR²), N = V·q = h·S·q, F = f(α)·n_f·W, n_f = k_v·h·S·q.
// Для тяготения k_a = k_v = f(α) = 1, C1 = 4πG ⇒ F = G·m1·m2/R².
const K_A = 1, K_V = 1, F_ALPHA = 1;
P.C1 = 4 * Math.PI * P.G;
const Q = (r) => K_A * P.C1 / (4 * Math.PI * r * r);
const kQ = () => K_A * P.C1 / (4 * Math.PI); // Q·r²

// Частица — сфера радиуса rad: S = πr², h = V/S = 4r/3, V = hS, N = Vq.
// Плотность q одна для всех (калибрована по N(e⁻) = 1), радиус — из N = V·q.
const RAD_E = 0.01;
const sphereV = (r) => (4 / 3) * Math.PI * r * r * r;
const Q_DENS = M_E / sphereV(RAD_E);
const radOf = (N) => Math.cbrt(N / (Q_DENS * (4 / 3) * Math.PI));
const RAD_P = radOf(M_P);
const RAD_N = radOf(M_N);
P.radE = RAD_E;
P.radP = RAD_P;
P.radN = RAD_N;
P.qE = P.qP = P.qN = Q_DENS;
P.mP = M_P;
P.mE = M_E;
P.mN = M_N;
function bodyProps(rad, q) {
  const S = Math.PI * rad * rad;
  const h = 4 * rad / 3;
  const V = h * S;
  const N = V * q;
  return { rad, q, S, h, V, N };
}
const SPECIES = {
  p: { rad: RAD_P, q: Q_DENS, color: '255,150,80', core: '#fff3e0', glow: 2, alpha: 0.45, label: 'p⁺' },
  n: { rad: RAD_N, q: Q_DENS, color: '200,205,215', core: '#f2f4f8', glow: 2, alpha: 0.5, label: 'n⁰' },
  e: { rad: RAD_E, q: Q_DENS, color: '80,230,255', core: '#eaffff', glow: 3, alpha: 0.9, label: 'e⁻' },
};
let nextNuc = 0;
function makeBody(kind, atom, pos, vel = [0, 0, 0]) {
  const props = bodyProps(SPECIES[kind].rad, SPECIES[kind].q);
  // инерция = n_f = k_v·h·S·q (для тяготения заряд — масса)
  return { kind, atom, ...props, m: K_V * props.N, p: [...pos], v: [...vel], trail: [] };
}
// Нуклон — одно тело с тегами nuc и nk ('p' | 'n'). Возвращается массивом, чтобы
// работать с ним как с группой (orbit, удаление, центр масс).
function makeNucleon(kind, atom, pos) {
  const body = makeBody(kind, atom, pos);
  body.nuc = nextNuc++;
  body.nk = kind;
  return [body];
}

// Q_j·N_j в точке на расстоянии r. Внутри шара радиуса R действует только
// заряд, попавший внутрь: N(r) = V(r)·q = N·(r/R)³ — та же N = Vq, без обрезки r.
function QN(r, R, Nj) {
  if (r <= 0) return 0;
  return Q(r) * (r >= R ? Nj : Nj * (r / R) ** 3);
}
// Потенциал пары (на kQ·N_i·N_j), согласованный с QN: −dφ/dr = QN/(kQ·N_j).
function phi(r, R) {
  return r >= R ? 1 / r : (3 * R * R - r * r) / (2 * R * R * R);
}

// Центр масс, суммарные N и m набора тел.
function lump(bodies) {
  let N = 0, m = 0, R = 0;
  const c = [0, 0, 0], cv = [0, 0, 0];
  for (const b of bodies) {
    N += b.N; m += b.m; R = Math.max(R, b.rad);
    for (let k = 0; k < 3; k++) { c[k] += b.m * b.p[k]; cv[k] += b.m * b.v[k]; }
  }
  for (let k = 0; k < 3; k++) { c[k] /= m; cv[k] /= m; }
  return { N, m, R, c, cv };
}
// Круговая орбита составного тела `moving` вокруг группы `group` из той же формулы:
// a = QN(r, R, 1)·(N_b·N_g/m_b + N_g·N_b/m_g) = v²/r, где QN учитывает и орбиту
// внутри шара (N(r) = V(r)·q). Все тела `moving` сдвигаются одинаково, импульс
// делится между ним и группой, так что суммарный импульс не меняется.
function orbit(moving, group, r) {
  const b = lump(moving), g = lump(group);
  const n = norm(randDir());
  const u = norm(cross(n, randDir()));
  const t = norm(cross(n, u));
  const aRel = QN(r, Math.max(b.R, g.R), 1) * (b.N * g.N / b.m + g.N * b.N / g.m);
  const vRel = Math.sqrt(aRel * r);
  const mt = g.m + b.m;
  // скорость общего центра масс до и после одна и та же
  const V = [0, 1, 2].map((k) => (b.m * b.cv[k] + g.m * g.cv[k]) / mt);
  const dp = [0, 1, 2].map((k) => g.c[k] + u[k] * r - b.c[k]);
  const dvb = [0, 1, 2].map((k) => V[k] + t[k] * vRel * g.m / mt - b.cv[k]);
  const dvg = [0, 1, 2].map((k) => V[k] - t[k] * vRel * b.m / mt - g.cv[k]);
  for (const x of moving) {
    for (let k = 0; k < 3; k++) { x.p[k] += dp[k]; x.v[k] += dvb[k]; }
  }
  for (const x of group) {
    for (let k = 0; k < 3; k++) x.v[k] += dvg[k];
  }
  return moving;
}

function randDir() {
  const u = Math.random(), v = Math.random();
  const th = 2 * Math.PI * u, ph = Math.acos(2 * v - 1);
  const s = Math.sin(ph);
  return [Math.cos(th) * s, Math.sin(th) * s, Math.cos(ph)];
}
function cross(a, b) {
  return [a[1] * b[2] - a[2] * b[1], a[2] * b[0] - a[0] * b[2], a[0] * b[1] - a[1] * b[0]];
}
function norm(a) {
  const l = Math.hypot(a[0], a[1], a[2]) || 1;
  return [a[0] / l, a[1] / l, a[2] / l];
}

// Атом дейтерия: p⁺ в покое, n⁰ на орбите rn вокруг p⁺, e⁻ на орбите r0 вокруг p⁺+n⁰.
function makeAtom(atom, base) {
  const p = makeNucleon('p', atom, base);
  const n = orbit(makeNucleon('n', atom, base), p, P.rn);
  const e = orbit([makeBody('e', atom, base)], [...p, ...n], P.r0);
  return [...p, ...n, ...e];
}
// Сцена: 'atoms' — старт с атомом дейтерия; 'sandbox' — пусто, частицы добавляются по одной.
function makeParts() {
  return P.scene === 'sandbox' ? [] : makeAtom(0, [0, 0, 0]);
}
let parts = makeParts();
let time = 0;
let nextAtom = 1;

// Состав системы. Тела с atom = −1 — свободные (без орбиты, в покое).
let E0 = null; // E на момент последнего изменения состава или G — от него считается ΔE/E
const changed = () => { E0 = null; };
const atomIds = () => [...new Set(parts.filter((q) => q.nk === 'p' && q.atom >= 0).map((q) => q.atom))];
const isFree = (kind) => (q) => q.kind === kind && q.atom === -1;
// Нуклоны как группы тел (в порядке появления).
function nucleons() {
  const m = new Map();
  for (const q of parts) {
    if (q.nuc === undefined) continue;
    let g = m.get(q.nuc);
    if (!g) m.set(q.nuc, g = { nuc: q.nuc, nk: q.nk, atom: q.atom, bodies: [] });
    g.bodies.push(q);
  }
  return [...m.values()];
}
function removeLast(pred) {
  for (let i = parts.length - 1; i >= 0; i--) {
    if (pred(parts[i])) { parts.splice(i, 1); changed(); return; }
  }
}
// Нуклон удаляется целиком — всеми своими телами.
function removeNucleon(pred) {
  const g = nucleons().reverse().find(pred);
  if (!g) return;
  parts = parts.filter((q) => q.nuc !== g.nuc);
  changed();
}
function centerOfMass() {
  let mx = 0, my = 0, mz = 0, mm = 0;
  for (const p of parts) { mx += p.m * p.p[0]; my += p.m * p.p[1]; mz += p.m * p.p[2]; mm += p.m; }
  return mm ? [mx / mm, my / mm, mz / mm] : [0, 0, 0];
}
function nearCOM(rMin, rMax) {
  const c = centerOfMass(), d = randDir();
  const r = rMin + Math.random() * (rMax - rMin);
  return insideChamber([c[0] + d[0] * r, c[1] + d[1] * r * 0.4, c[2] + d[2] * r]);
}

function addAtom() {
  parts.push(...makeAtom(nextAtom++, nearCOM(2.3, 3.5)));
  changed();
}
function removeAtom() {
  const ids = atomIds();
  if (!ids.length) return;
  const atom = ids[ids.length - 1];
  for (let i = parts.length - 1; i >= 0; i--) {
    if (parts[i].atom === atom) parts.splice(i, 1);
  }
  changed();
}
function addNeutron() {
  if (P.scene === 'sandbox') {
    parts.push(...makeNucleon('n', -1, nearCOM(1.5, 3)));
    changed();
    return;
  }
  const ids = atomIds();
  if (!ids.length) return;
  const withN = new Set(parts.filter((q) => q.nk === 'n').map((q) => q.atom));
  const atom = ids.find((a) => !withN.has(a)) ?? ids[ids.length - 1];
  const nucleus = parts.filter((q) => q.nuc !== undefined && q.atom === atom);
  const index = new Set(nucleus.filter((q) => q.nk === 'n').map((q) => q.nuc)).size;
  const host = nucleus[0];
  parts.push(...orbit(makeNucleon('n', atom, host.p), nucleus, P.rn * (1 + 0.35 * index)));
  changed();
}
const removeNeutron = () => removeNucleon((g) => g.nk === 'n');
function addProton() {
  parts.push(...makeNucleon('p', -1, nearCOM(1.5, 3)));
  changed();
}
const removeProton = () => removeNucleon((g) => g.nk === 'p' && g.atom === -1);
function addElectron() {
  parts.push(makeBody('e', -1, nearCOM(0.8, 2.2)));
  changed();
}
const removeElectron = () => removeLast(isFree('e'));
function reset() {
  nextNuc = 0;
  parts = makeParts(); time = 0; nextAtom = 1;
  resetChamber();
}
function setG(G) {
  P.G = G;
  P.C1 = 4 * Math.PI * G;
  changed();
}

// ---------- камера ----------
// Замкнутая упругая сфера вокруг сцены. Стенка — источник с зарядом N и f(α) = −1
// (отталкивание): на тело на расстоянии d от стенки действует W = Q(d)·N, направленное
// от стенки. У самой стенки (d < δ) — тот же внутренний закон, что у тел: N(d) = N·(d/δ)³.
// Радиус R — отдельная степень свободы: инерция m = k_v·N, пружина к R₀ с жёсткостью
// K = kQ·N·κ; давление тел растягивает стенку, пружина возвращает.
const F_ALPHA_WALL = -1;
const CH = {
  on: false, c: [0, 0, 0], R0: 5, R: 5, V: 0, N: 1e3, kappa: 1e4, delta: 0.02, aR: 0,
  hFrac: 0.2, // толщина вязкого слоя у стенки, доля R
  visc: 10,   // вязкость слоя в единицах собственной частоты стенки
  zeta: 1,    // затухание радиуса (1 — критическое, без колебаний)
  lost: 0,    // энергия, ушедшая в вязкость и затухание
};
const wallM = () => K_V * CH.N;
const wallK = () => kQ() * CH.N * CH.kappa;
function resetChamber() {
  CH.c = centerOfMass();
  CH.R = CH.R0;
  CH.V = 0;
  changed();
}
function setChamber(on) {
  CH.on = on;
  resetChamber();
}
// Новое тело кладётся внутрь камеры, если она включена.
function insideChamber(pos) {
  if (!CH.on) return pos;
  const r = [0, 1, 2].map((k) => pos[k] - CH.c[k]);
  const rm = Math.hypot(...r), lim = 0.8 * CH.R;
  if (rm <= lim) return pos;
  return [0, 1, 2].map((k) => CH.c[k] + r[k] * lim / rm);
}

// ---------- панель ----------
const G_HONEST = 2.4e-43;
const OPS = {
  p: [removeProton, addProton],
  n: [removeNeutron, addNeutron],
  e: [removeElectron, addElectron],
  a: [removeAtom, addAtom],
};
// какие строки видны в каждой сцене
const ROWS = {
  atoms: ['p', 'n', 'e', 'a'],
  sandbox: ['p', 'n', 'e'],
};
const ROW_TIPS = {
  p: '+ свободный протон в покое рядом с центром масс\n− убирает последний свободный протон',
  n: '+ нейтрон: в атомах — на орбиту вокруг ядра, в песочнице — в покое\n− убирает последний нейтрон',
  e: '+ свободный электрон в покое рядом с центром масс\n− убирает последний свободный электрон',
  a: '+ атом дейтерия p⁺ + n⁰ + e⁻\n− убирает последний атом целиком',
};
const panel = document.getElementById('panel');
function makePanel() {
  const row = (k, label, sym) =>
    `<div class="row" data-k="${k}" title="${ROW_TIPS[k]}"><span class="lbl">${label} <span class="sym">${sym}</span></span>` +
    `<button data-op="0" aria-label="убрать ${label}">−</button><span class="cnt"></span>` +
    `<button data-op="1" aria-label="добавить ${label}">+</button></div>`;
  panel.innerHTML =
    `<h2>Режим</h2>` +
    `<div class="seg">` +
    `<button data-scene="atoms" title="старт с атомом дейтерия p⁺ + n⁰ + e⁻">атомы</button>` +
    `<button data-scene="sandbox" title="старт с пустой сцены, частицы добавляются по одной">песочница</button>` +
    `</div>` +
    `<h2 id="partsHead">Частицы</h2>` +
    `${row('p', 'протон', 'p⁺')}${row('n', 'нейтрон', 'n⁰')}${row('e', 'электрон', 'e⁻')}` +
    `${row('a', 'атом', 'p⁺n⁰e⁻')}` +
    `<h2>Постоянная G</h2>` +
    `<input id="gSl" type="range" min="-45" max="6" step="0.01" aria-label="log10 G">` +
    `<div id="gVal" class="note"></div>` +

// W_i = Σ_j Q_j·N_j (вектор к источнику), F_i = f(α)·n_f·W_i, n_f = k_v·N_i, a_i = F_i/m_i.
function accelerate() {
  const a = parts.map(() => [0, 0, 0]);
  for (let i = 0; i < parts.length; i++) {
    const A = parts[i];
    let Wx = 0, Wy = 0, Wz = 0;
    for (let j = 0; j < parts.length; j++) {
      if (j === i) continue;
      const B = parts[j];
      const rx = B.p[0] - A.p[0], ry = B.p[1] - A.p[1], rz = B.p[2] - A.p[2];
      const r = Math.hypot(rx, ry, rz);
      if (r === 0) continue;
      const w = QN(r, Math.max(A.rad, B.rad), B.N);
      Wx += w * rx / r; Wy += w * ry / r; Wz += w * rz / r;
    }
    const F = F_ALPHA * K_V * A.N;
    a[i][0] = F * Wx / A.m;
    a[i][1] = F * Wy / A.m;
    a[i][2] = F * Wz / A.m;
  }
  if (CH.on) accelerateWall(a);
  return a;
}
// Пружина стенки к R₀: ½K(R−R₀)². Колебания радиуса гасит затухание (dampWall).
const springU = () => 0.5 * wallK() * (CH.R - CH.R0) ** 2;
const springF = () => -wallK() * (CH.R - CH.R0);
const wallOmega = () => Math.sqrt(wallK() / wallM()); // собственная частота стенки = √(kQ·κ)

// Вязкий слой у стенки и затухание радиуса — не из формулы W = Q·N, а добавка модели.
// В слое толщиной h = hFrac·R тело тормозится относительно стенки с темпом
// γ = visc·ω·(1 − d/h)² — тем сильнее, чем ближе к стенке; сила торможения уходит в
// стенку (импульс пары сохраняется). Радиус гасится с ζ: Ṙ ∝ e^(−2ζω·t).
// Потерянная энергия копится в CH.lost, так что E + потери = const.
function dampWall(dt) {
  const M = wallM(), w = wallOmega(), h = CH.hFrac * CH.R;
  for (const A of parts) {
    const rx = A.p[0] - CH.c[0], ry = A.p[1] - CH.c[1], rz = A.p[2] - CH.c[2];
    const rm = Math.hypot(rx, ry, rz);
    const d = CH.R - rm;
    if (rm === 0 || d <= 0 || d >= h) continue;
    const nx = rx / rm, ny = ry / rm, nz = rz / rm;
    const u = A.v[0] * nx + A.v[1] * ny + A.v[2] * nz - CH.V; // скорость к стенке относительно неё
    const u2 = u * Math.exp(-CH.visc * w * (1 - d / h) ** 2 * dt);
    const mt = A.m + M, du = u2 - u;
    CH.lost += 0.5 * (A.m * M / mt) * (u * u - u2 * u2);
    const dv = du * M / mt;
    A.v[0] += dv * nx; A.v[1] += dv * ny; A.v[2] += dv * nz;
    CH.V -= du * A.m / mt;
  }
  const V2 = CH.V * Math.exp(-2 * CH.zeta * w * dt);
  CH.lost += 0.5 * M * (CH.V * CH.V - V2 * V2);
  CH.V = V2;
}

// Стенка камеры: W = Q(d)·N к стенке, F = f(α)·n_f·W с f(α) = −1 — от стенки.
// Стенка действует только изнутри (d > 0): вылетевшее тело её больше не толкает,
// потенциал снаружи постоянный и непрерывно продолжает внутренний.
// Реакция тел на стенку растягивает радиус; CH.aR — ускорение радиуса.
function accelerateWall(a) {
  let FR = 0;
  for (let i = 0; i < parts.length; i++) {
    const A = parts[i];
    const rx = A.p[0] - CH.c[0], ry = A.p[1] - CH.c[1], rz = A.p[2] - CH.c[2];
    const rm = Math.hypot(rx, ry, rz);
    const d = CH.R - rm;
    if (rm === 0 || d <= 0) continue;
    const F = F_ALPHA_WALL * K_V * A.N * QN(d, CH.delta, CH.N); // вдоль r̂: к стенке со знаком f(α)
    a[i][0] += F * rx / rm / A.m;
    a[i][1] += F * ry / rm / A.m;
    a[i][2] += F * rz / rm / A.m;
    FR -= F;
  }
  CH.aR = (FR + springF()) / wallM();
}


// Динамическое время самой тесной пары из той же формулы: t = √(r³ / (kQ·(N_i+N_j))).
function dynTime() {
  let t = Infinity;
  for (let i = 0; i < parts.length; i++) {
    for (let j = i + 1; j < parts.length; j++) {
      const A = parts[i], B = parts[j];
      const r = Math.max(Math.max(A.rad, B.rad),
        Math.hypot(B.p[0] - A.p[0], B.p[1] - A.p[1], B.p[2] - A.p[2]));
      t = Math.min(t, Math.sqrt(r * r * r / (kQ() * (A.N + B.N))));
    }
  }
  if (CH.on) {
    // тело у стенки и колебание самой стенки
    for (const A of parts) {
      const d = Math.max(CH.delta, Math.abs(CH.R - Math.hypot(A.p[0] - CH.c[0], A.p[1] - CH.c[1], A.p[2] - CH.c[2])));
      t = Math.min(t, Math.sqrt(d * d * d / (kQ() * CH.N)));
    }
    t = Math.min(t, Math.sqrt(wallM() / wallK()));
  }
  return t;
}

function step(dt) {
  const a0 = accelerate();
  if (CH.on) CH.V += 0.5 * CH.aR * dt;
  for (let i = 0; i < parts.length; i++) {
    const p = parts[i];
    p.v[0] += 0.5 * a0[i][0] * dt; p.v[1] += 0.5 * a0[i][1] * dt; p.v[2] += 0.5 * a0[i][2] * dt;
  }
  if (CH.on) dampWall(0.5 * dt);
  for (const p of parts) {
    p.p[0] += p.v[0] * dt; p.p[1] += p.v[1] * dt; p.p[2] += p.v[2] * dt;
  }
  if (CH.on) {
    CH.R += CH.V * dt;
    // страховка: стенка с затуханием до нуля не доходит, но вырождаться ей нельзя
    if (CH.R < 0.05 * CH.R0) { CH.R = 0.05 * CH.R0; CH.V = Math.max(0, CH.V); }
  }
  const a1 = accelerate();
  if (CH.on) CH.V += 0.5 * CH.aR * dt;
  for (let i = 0; i < parts.length; i++) {
    const p = parts[i];
    p.v[0] += 0.5 * a1[i][0] * dt; p.v[1] += 0.5 * a1[i][1] * dt; p.v[2] += 0.5 * a1[i][2] * dt;
  }
  if (CH.on) dampWall(0.5 * dt);
  for (const p of parts) {
    p.trail.push([p.p[0], p.p[1], p.p[2]]);
    if (p.trail.length > TRAIL_LEN + TRAIL_SLACK) p.trail.splice(0, TRAIL_SLACK);
  }
  time += dt;
}
// ---------- 3D → экран ----------
let W = 0, H = 0, dpr = 1;
function resize() {
  dpr = Math.max(1, Math.min(2, devicePixelRatio || 1));
  canvas.width = Math.floor(innerWidth * dpr);
  canvas.height = Math.floor(innerHeight * dpr);
  W = innerWidth; H = innerHeight;
}
addEventListener('resize', resize);
resize();

function project(p) {
  const cy = Math.cos(P.yaw), sy = Math.sin(P.yaw);
  const cp = Math.cos(P.pitch), sp = Math.sin(P.pitch);
  const px = p[0] - P.tx, py = p[1] - P.ty, pz = p[2] - P.tz;
  const x1 = px * cy - pz * sy;
  const z1 = px * sy + pz * cy;
  const y1 = py;
  const y2 = y1 * cp - z1 * sp;
  const z2 = y1 * sp + z1 * cp;
  const zc = z2 + P.camR;
  if (zc < 0.2) return null;
  const s = P.focal / zc;
  return [W / 2 + x1 * s, H / 2 - y2 * s, zc, s];
}

function glow(x, y, r, rgb, a) {
  const g = ctx.createRadialGradient(x, y, 0, x, y, r);
  g.addColorStop(0, `rgba(${rgb},${a})`);
  g.addColorStop(0.45, `rgba(${rgb},${a * 0.5})`);
  g.addColorStop(1, `rgba(${rgb},0)`);
  ctx.fillStyle = g;
  ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI * 2); ctx.fill();
}

// Свечение = Q_j·N_j тела, отнесённое к полю протона на r0: та же QN, что и в динамике.
function drawField() {
  ctx.globalCompositeOperation = 'lighter';
  const W0 = QN(P.r0, 0, P.mP);
  const cut = 0.02;
  for (let idx = 0; idx < parts.length; idx++) {
    const pt = parts[idx];
    const s = project(pt.p);
    if (!s) continue;
    const worldR = P.r0 * Math.sqrt(pt.N / P.mP / cut);
    const screenR = worldR * s[3];
    if (!(screenR > 4)) continue;
    const g = ctx.createRadialGradient(s[0], s[1], 0, s[0], s[1], screenR);
    const rgb = pt.atom === 0 ? '90,170,255' : '255,160,90';
    for (let k = 0; k <= 20; k++) {
      const kk = k / 20;
      const a = Math.min(0.35, 0.35 * QN(kk * worldR, pt.rad, pt.N) / W0);
      g.addColorStop(kk, 'rgba(' + rgb + ',' + a.toFixed(4) + ')');
    }
    ctx.fillStyle = g;
    ctx.beginPath();
    ctx.arc(s[0], s[1], screenR, 0, Math.PI * 2);
    ctx.fill();
  }
  ctx.globalCompositeOperation = 'source-over';
}
// Камера: силуэт сферы радиуса R (сплошной) и R₀ (пунктир); свечение у стенки.
function drawChamber() {
  const s = project(CH.c);
  if (!s) return;
  const rr = CH.R * s[3], r0 = CH.R0 * s[3];
  if (!(rr > 1) || !(r0 > 0)) return; // вырожденная сфера — нечего рисовать
  const g = ctx.createRadialGradient(s[0], s[1], rr * 0.85, s[0], s[1], rr);
  g.addColorStop(0, 'rgba(150,120,255,0)');
  g.addColorStop(1, 'rgba(150,120,255,0.22)');
  ctx.fillStyle = g;
  ctx.beginPath(); ctx.arc(s[0], s[1], rr, 0, Math.PI * 2); ctx.fill();
  ctx.strokeStyle = 'rgba(170,140,255,.6)';
  ctx.lineWidth = 1.5;
  ctx.beginPath(); ctx.arc(s[0], s[1], rr, 0, Math.PI * 2); ctx.stroke();
  ctx.strokeStyle = 'rgba(170,140,255,.25)';
  ctx.lineWidth = 1;
  ctx.setLineDash([3, 6]);
  ctx.beginPath(); ctx.arc(s[0], s[1], r0, 0, Math.PI * 2); ctx.stroke();
  ctx.setLineDash([]);
}
function draw() {
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  ctx.clearRect(0, 0, W, H);
  ctx.fillStyle = '#000';
  ctx.fillRect(0, 0, W, H);
  if (P.showField) drawField();
  if (CH.on) drawChamber();

  // следы всех частиц цветом своего вида (кнопка «след», клавиша T).
  // Яркость 0.10·(1 − возраст/TRAIL_LEN); рисуется полосами по TRAIL_BANDS — одна
  // обводка на полосу вместо одной на отрезок.
  if (P.showTrail) {
    const TRAIL_BANDS = 24;
    ctx.lineWidth = 1.5;
    for (const b of parts) {
      const tr = b.trail, n = tr.length;
      if (n < 2) continue;
      const pts = tr.map(project);
      const color = SPECIES[b.kind].color;
      for (let band = 0; band < TRAIL_BANDS; band++) {
        // возрастной диапазон полосы: от старых к новым
        const ageHi = TRAIL_LEN * (1 - band / TRAIL_BANDS), ageLo = TRAIL_LEN * (1 - (band + 1) / TRAIL_BANDS);
        const iLo = Math.max(1, Math.ceil(n - 1 - ageHi)), iHi = Math.min(n - 1, Math.floor(n - 1 - ageLo));
        if (iLo > iHi) continue;
        ctx.strokeStyle = `rgba(${color},${(0.10 * (band + 0.5) / TRAIL_BANDS).toFixed(4)})`;
        ctx.beginPath();
        for (let i = iLo; i <= iHi; i++) {
          const A = pts[i - 1], B = pts[i];
          if (!A || !B) continue;
          ctx.moveTo(A[0], A[1]); ctx.lineTo(B[0], B[1]);
        }
        ctx.stroke();
      }
    }
  }

  // линия между протонами (по центрам масс нуклонов)
  const nucs = nucleons().map((g) => ({ ...g, ...lump(g.bodies) }));
  const pps = nucs.filter((g) => g.nk === 'p');
  const s0 = pps[0] ? project(pps[0].c) : null;
  const s1 = pps[1] ? project(pps[1].c) : null;
  if (s0 && s1) {
    ctx.strokeStyle = 'rgba(160,190,220,.25)';
    ctx.setLineDash([4, 5]);
    ctx.beginPath(); ctx.moveTo(s0[0], s0[1]); ctx.lineTo(s1[0], s1[1]); ctx.stroke();
    ctx.setLineDash([]);
  }

  // частицы: экранный радиус = rad * s — в масштабе объёма
  for (const kind of ['p', 'n', 'e']) {
    const sp = SPECIES[kind];
    for (const pt of parts) {
      if (pt.kind !== kind) continue;
      const s = project(pt.p);
      if (!s) continue;
      const rr = Math.max(0.7, pt.rad * s[3]);
      glow(s[0], s[1], Math.max(rr * sp.glow, 1.5), sp.color, sp.alpha);
      ctx.fillStyle = sp.core;
      ctx.beginPath(); ctx.arc(s[0], s[1], rr, 0, Math.PI * 2); ctx.fill();
    }
  }

  // подписи
  ctx.font = '13px "Courier New"';
  ctx.fillStyle = '#9fb0c2';
  for (const pt of parts) {
    const s = project(pt.p);
    if (!s) continue;
    const dy = Math.max(12, pt.rad * s[3] + 10);
    ctx.fillText(SPECIES[pt.kind].label, s[0] - 6, s[1] - dy);
  }

  return { s0, s1 };
}

// камера
let dragging = false, lx = 0, ly = 0;
canvas.addEventListener('pointerdown', (e) => { dragging = true; lx = e.clientX; ly = e.clientY; });
canvas.addEventListener('pointerup', () => { dragging = false; });
canvas.addEventListener('pointercancel', () => { dragging = false; });
canvas.addEventListener('pointermove', (e) => {
  if (!dragging) return;
  P.yaw += (e.clientX - lx) * 0.006;
  P.pitch = Math.max(-1.4, Math.min(1.4, P.pitch + (e.clientY - ly) * 0.006));
  lx = e.clientX; ly = e.clientY;
});
canvas.addEventListener('wheel', (e) => {
  P.camR = Math.max(0.8, Math.min(20, P.camR * (1 + e.deltaY * 0.001)));
  e.preventDefault();
}, { passive: false });

// цикл
let last = performance.now();
let simAcc = 0;
let FIXED = 1 / 120;
let fps = 0, fpsN = 0, fpsT = performance.now();

// E = KE + U, U = −kQ·N_i·N_j·φ(r): потенциал той же силы, что в accelerate().
function totalEnergy() {
  let E = 0;
  const px = [0, 0, 0];
  for (const p of parts) {
    E += 0.5 * p.m * (p.v[0] * p.v[0] + p.v[1] * p.v[1] + p.v[2] * p.v[2]);
    for (let k = 0; k < 3; k++) px[k] += p.m * p.v[k];
  }
  for (let i = 0; i < parts.length; i++) {
    for (let j = i + 1; j < parts.length; j++) {
      const A = parts[i], B = parts[j];
      const r = Math.hypot(B.p[0] - A.p[0], B.p[1] - A.p[1], B.p[2] - A.p[2]);
      E -= F_ALPHA * K_V * kQ() * A.N * B.N * phi(r, Math.max(A.rad, B.rad));
    }
  }
  if (CH.on) {
    // стенка: U = −f(α)·kQ·N_i·N·φ(d) у каждого тела (снаружи — φ(0), константа)
    // + пружина растяжения + движение радиуса
    for (const A of parts) {
      const d = CH.R - Math.hypot(A.p[0] - CH.c[0], A.p[1] - CH.c[1], A.p[2] - CH.c[2]);
      E -= F_ALPHA_WALL * K_V * kQ() * A.N * CH.N * phi(Math.max(d, 0), CH.delta);
    }
    E += springU() + 0.5 * wallM() * CH.V * CH.V;
  }
  return { E, Pm: Math.hypot(px[0], px[1], px[2]) };
}

function frame() {
  const now = performance.now();
  const realDt = Math.min((now - last) / 1000, 0.05);
  last = now;

  if (!P.paused) {
    FIXED = Math.min(1 / 120, 0.02 * dynTime());
    simAcc += realDt * P.timeScale;
    let n = 0;
    while (simAcc >= FIXED && n < 400) { step(FIXED); simAcc -= FIXED; n++; }
    if (n === 400) simAcc = 0;
  }

  const cy2 = Math.cos(P.yaw), sy2 = Math.sin(P.yaw);
  const fwd = (keys['w'] ? 1 : 0) - (keys['s'] ? 1 : 0);
  const rgt = (keys['d'] ? 1 : 0) - (keys['a'] ? 1 : 0);
  const up2 = (keys['e'] ? 1 : 0) - (keys['q'] ? 1 : 0);
  if (fwd || rgt || up2) {
    const sp2 = P.camSpeed * realDt;
    P.ox += (fwd * -cy2 + rgt * -sy2) * sp2;
    P.oz += (fwd * -sy2 + rgt * -cy2) * sp2;
    P.oy += up2 * sp2;
  }

  const c = centerOfMass();
  const kf = 1 - Math.exp(-realDt * 3);
  P.tx += (c[0] + P.ox - P.tx) * kf;
  P.ty += (c[1] + P.oy - P.ty) * kf;
  P.tz += (c[2] + P.oz - P.tz) * kf;

  draw();

  fpsN++;
  if (now - fpsT > 500) { fps = fpsN / ((now - fpsT) / 1000); fpsN = 0; fpsT = now; }

  // нуклоны — группы тел, их положение и скорость — центр масс группы
  const nucs = nucleons().map((g) => ({ ...g, ...lump(g.bodies) }));
  const protons = nucs.filter((g) => g.nk === 'p');
  const neutrons = nucs.filter((g) => g.nk === 'n');
  const electrons = parts.filter((q) => q.kind === 'e');
  const p0 = protons[0], n0 = neutrons[0];
  const dist = (a, b) => Math.hypot(a[0] - b[0], a[1] - b[1], a[2] - b[2]);
  let R = 0;
  for (let i = 0; i < protons.length; i++) {
    for (let j = i + 1; j < protons.length; j++) {
      const d = dist(protons[j].c, protons[i].c);
      if (!R || d < R) R = d;
    }
  }
  const Rn = (p0 && n0) ? dist(n0.c, p0.c) : 0;
  const vn = (p0 && n0) ? dist(n0.cv, p0.cv) : 0;
  const rnLine = n0 ? `\nR(p–n) = ${Rn.toFixed(2)} a₀ · v=${vn.toExponential(2)}` : '';
  const en = totalEnergy();
  if (E0 === null) { E0 = en.E; CH.lost = 0; }
  // с камерой часть энергии уходит в вязкость стенки: баланс — E + потери
  const lost = CH.on ? CH.lost : 0;
  const dE = E0 ? (en.E + lost - E0) / Math.abs(E0) : 0;
  const counts = {
    p: protons.length, n: neutrons.length, e: electrons.length, a: atomIds().length,
    pFree: protons.filter((g) => g.atom === -1).length,
    eFree: electrons.filter((q) => q.atom === -1).length,
  };
  sum.textContent =
`W = Q·N · 3D · ${P.scene === 'sandbox' ? 'песочница' : 'атомы'}${P.paused ? ' · пауза' : ''}
p⁺ ${counts.p} · n⁰ ${counts.n} · e⁻ ${counts.e} · A ${counts.p + counts.n} · Z ${counts.p} · тел ${parts.length}
E = ${en.E.toExponential(4)} · ΔE/E = ${dE.toExponential(1)}${CH.on ? ' (с потерями)' : ''}${CH.on ? `\nкамера: R = ${CH.R.toFixed(3)} · R₀ = ${CH.R0.toFixed(1)} · потери ${CH.lost.toExponential(2)}` : ''}
t = ${time.toFixed(1)} · FPS = ${fps.toFixed(0)}`;
  if (more.open) det.textContent =
`воздействие = качество × количество
Q = k_a·C1/(4πR²) — качество; N = V·q = h·S·q — количество (заряд)
W = Σ Q_j·N_j; F = f(α)·n_f·W, n_f = k_v·N; a = F/m
k_a = k_v = f(α) = 1 · C1 = 4πG = ${P.C1.toExponential(2)}
q = ${Q_DENS.toExponential(2)} у всех тел; N = V·q
p⁺: N = ${M_P}, радиус ${RAD_P.toFixed(4)}
n⁰: N = ${M_N}, радиус ${RAD_N.toFixed(4)}
e⁻: N = ${M_E}, радиус ${RAD_E}
только доказанные частицы с измеренной массой: p⁺, n⁰, e⁻
R(p–p, min) = ${R ? R.toFixed(2) : '—'} a₀${rnLine}
|p| = ${en.Pm.toExponential(1)} · сложность O(N²)
без кулона, кора, БГП и тени`;
  syncPanel(counts);
  syncCards();

requestAnimationFrame(frame);
}

const keys = {};
addEventListener('keydown', (e) => {
  if (e.target.tagName === 'INPUT') return;
  keys[e.key.toLowerCase()] = true;
  if (e.code === 'Space') { P.paused = !P.paused; e.preventDefault(); }
  if (e.key.toLowerCase() === 'r') reset();
  if (e.key.toLowerCase() === 'g') P.showField = !P.showField;
  if (e.key.toLowerCase() === 't') P.showTrail = !P.showTrail;
});
addEventListener('keyup', (e) => { keys[e.key.toLowerCase()] = false; });

makePanel();
makeCards();
// на узком экране описание частиц свёрнуто, чтобы не закрывать сцену
if (matchMedia('(max-width: 640px)').matches) document.getElementById('infoBox').open = false;
document.getElementById('help').textContent =
`мышь: drag — вращение, колесо — масштаб
WASD — смещение, Q/E — вверх/вниз
камера следит за центром масс
Space — пауза · R — сброс · G — поле · T — след

Только W = Q·N: гравитация тел, без кулона, кора, БГП и тени.
Начальные скорости — круговые орбиты из той же формулы (a = Q·N = v²/r).
Свободные p⁺ и e⁻ появляются в покое; дальше их ведёт только W.
Нейтрон держится только гравитацией; сильного взаимодействия нет.
В модели только частицы, доказанные напрямую и с измеренной массой:
p⁺, n⁰, e⁻ — каждая одно однородное тело.
«Песочница» — пустая сцена: p⁺, n⁰, e⁻ добавляются по одной,
в покое рядом с центром масс; всё дальше решает W.
«Камера» — замкнутая упругая сфера. Стенка — источник с зарядом N
и f(α) = −1: тело у стенки отталкивается по Q(d)·N, сильнее всего
вплотную. У стенки вязкий слой (h): тело в нём тормозится тем
сильнее, чем ближе к стенке, и толкает стенку. Радиус R растягивается
и с затуханием (ζ) возвращается к R₀. Вязкость и затухание — добавка
модели: энергия уходит в «потери», баланс — E + потери.
Импульс тел при этом не сохраняется — стенка внешняя.
При честном G движение невидимо — включите «демо» и нажмите сброс.
Масштаб m_p=1836, m_n=1839, m_e=1. Числа модельные, не СИ.`;
requestAnimationFrame(frame);

window.__h2d = {
  P, CH, setChamber, Q, QN, lump, nucleons, makeBody, makeNucleon, accelerate, step, totalEnergy, dynTime, reset,
  M: { M_P, M_N, RAD_P, RAD_N },
  get parts() { return parts; },
  set parts(v) { parts = v; },
  get R() {
    const ps = nucleons().filter((g) => g.nk === 'p').map((g) => lump(g.bodies).c);
    return ps.length > 1 ? Math.hypot(ps[1][0] - ps[0][0], ps[1][1] - ps[0][1], ps[1][2] - ps[0][2]) : 0;
  },
  get A() { return nucleons().length; },
  get Z() { return nucleons().filter((g) => g.nk === 'p').length; },
  get time() { return time; },
};
</script>
</body>
